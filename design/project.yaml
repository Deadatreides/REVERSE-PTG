  "rptg.plan.machine.refresh:remove":    {decisions: 18}
  "rptg.plan.machine.refresh:jobs":      {decisions: 5}
  "rptg.plan.machine.refresh:store":     {decisions: 2}
  "rptg.plan.machine.refresh:apply":     {decisions: 6}
