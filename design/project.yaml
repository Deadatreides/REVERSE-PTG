  # (judge.data, judge.logic, judge.examples — теперь outcome.verdict своего слоя)
  "rptg.check.contract.data.edges:jobs":      {decisions: 33}
  "rptg.check.contract.data.subs:jobs":       {decisions: 6}
  "rptg.check.contract.data.outcome:verdict": {decisions: 10}
  "rptg.check.contract.logic.facts:plan":     {decisions: 53}
  # 29.09.2026: равенства по типу вынесены из facts в свой лист (вариант (а) пользователя), выполнимость
  # условий (I14) — тем же правилом «по работам»; D новых листьев — до кода
  "rptg.check.contract.logic.equal:expand":   {decisions: 16}
  "rptg.check.contract.logic.feasible:jobs":  {decisions: 13}
  "rptg.check.contract.logic.render:obligations": {decisions: 11}
  "rptg.check.contract.logic.outcome:verdict": {decisions: 20}
  "rptg.check.contract.examples.samples:jobs":   {decisions: 22}
  "rptg.check.contract.examples.outcome:verdict": {decisions: 9}
  "rptg.check.code.rules:check":         {decisions: 27}
  "rptg.check.code.size:check":          {decisions: 23}
  "rptg.check.code.outcome:static":      {decisions: 3}
  # 29.09.2026, постройка build: цель сборки в корне — без вида (узел:операция у функции, узел у
  # сборки; requires build_files: subject in state.code), а check ждал Subject с видом. Новый класс
  # поведения — вывести предмет и узел из вида цели: runs 20 → 21, applied 7 → 8; до кода
  "rptg.check.code.runs:read":           {decisions: 21}
  "rptg.check.verdict.applied:apply":    {decisions: 8}
  "rptg.check.verdict.content:of":       {decisions: 22}
  "rptg.check.verdict.order:assemble":   {decisions: 6}
  "rptg.check.verdict.accept:judge":     {decisions: 8}
