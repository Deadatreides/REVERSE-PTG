  "rptg.talk.price:cost":                {decisions: 6}
  # rptg.build — D объявлено 30.09.2026 по карточкам до кода (REVERSE-PTG-BUILD.md §3 в корне
  # рабочей папки); S = 0 у всех: среда _rt и прогонщик — данные разложения, а не строки кода
  "rptg.build.plan:layout":              {decisions: 16}
  "rptg.build.plan:ops":                 {decisions: 13}
  "rptg.build.conds:jobs":               {decisions: 4}
  "rptg.build.conds:bind":               {decisions: 4}
