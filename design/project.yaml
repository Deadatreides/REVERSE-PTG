# Настройки проекта rptg — rptg строит сам себя.
# Операторы — те же имена, что в документации; модели и цены задаёт пользователь.
name: rptg
package: rptg
idea: >
  Программа, которая строит программы по графу. Архитектор пишет центральный узел, его рёбра и
  карту сети; конструкторы раскладывают составные узлы на любую глубину; исполнители пишут функции
  финальных узлов. Соединительный код генерирует скрипт, а принимает всё только детерминированными
  проверками по карточкам. Модели — любых поставщиков вперемешку.

limits:
  max_depth: 8
  max_children: 7
  final_max_ops: 6
  final_max_lines: 60        # у rptg функции крупнее, чем в учебном примере накладных
  max_complexity: 12
  k_lists: 3
  z3_rlimit: 5000000         # детерминированный предел решателя (находка С-6)
  hypothesis_examples: 200

roles:
  architect:   [opus]
  designer:    [gemini, grok, opus]
  implementer: [gguf, mini, gemini, opus]

operators:
  opus:   {id: opus, provider: anthropic, model: claude-opus-5, output_mode: json_schema, steps: combined, prices: {input: "0", output: "0"}, prompt_version: p1}
  gemini: {id: gemini, provider: google, model: "<модель>", output_mode: json_schema, steps: combined, prices: {input: "0", output: "0"}, prompt_version: p1}
  grok:   {id: grok, provider: openrouter, model: "<x-ai/…>", output_mode: json_schema, steps: combined, prices: {input: "0", output: "0"}, prompt_version: p1}
  mini:   {id: mini, provider: openrouter, model: "<…-mini>", output_mode: json_schema, steps: combined, prices: {input: "0", output: "0"}, prompt_version: p1}
  gguf:   {id: gguf, provider: llamacpp, model: "<qwen-coder gguf>", output_mode: grammar, steps: split, prices: {input: "0", output: "0"}, prompt_version: p1}

routing:
  target: 0.8
  n_min: 10
  prior_bands: {designer: [45, 70], implementer: [30, 55, 75]}
  adapt: false
  explore: 0.0

repair: {per_rung: 1, form_retries: 2}

overrides:
  # Подсистемы rptg раскладывает сильнейшая модель: это метапрограмма, а малые планировщики
  # промахиваются (LIFE-9); качество графа, построенного моделью, не измерено (OQ-DEC-1).
  "level:2": {designer: opus}
  # Рекурсивные алгоритмы над деревьями не делятся на функции по 60 строк: функции листа не
  # вызывают друг друга (находка С-5). Предел строк у листьев lang теперь — функция (contracts
  # ниже), ручной остался только предел сложности блока: разбор по 17 видам узлов дерева даёт
  # развилку шире 12 в одном блоке.
  "rptg.lang.cl.parse":        {kind: final, max_complexity: 40}
  "rptg.lang.cl.typecheck":    {kind: final, max_complexity: 45}
  "rptg.lang.cl.evaluate":     {kind: final, max_complexity: 40}
  "rptg.lang.cl.python":       {kind: final, max_complexity: 30}
  "rptg.lang.cl.logic.smt":    {kind: final, max_complexity: 45}
  # Лист фактов типов: договор D = 33 даёт предел 76 строк кода — функция целиком (Н-4).
  "rptg.lang.cl.logic.schema": {kind: final}
  # Развёртка схем П4: одна работа, D объявлено ниже до кода; предел строк — функция договора.
  # С 29.09.2026 лист живёт в слое logic (rptg.check.contract.logic.facts) — путь перенесён.
  "rptg.check.contract.logic.facts": {kind: final, max_complexity: 35}
  # rptg.build.types — ручной предел снят 30.09.2026: build разложен, D объявлено ниже до кода

# Договоры операций листьев для Э1 (REVERSE-PTG-LIMIT-FUNCTION.md). Предел строк — функция:
# строк кода ≤ 2·D_код + S + 10, D_код считает проверка по коду; S — прямолинейные шаги, которых
# требует договор (у разборщика — символы правых частей грамматики LOGIC §4.1, группа
# альтернатив в скобках — один символ). decisions — договорное число решений, объявленное по
# стандарту разметки до кода: тогда ещё D_код ≤ 1,5·D + 5. У lang оно объявлено только для
# schema — единственной разметки по стандарту; остальные листья lang написаны раньше стандарта.
contracts:
  "rptg.lang.cl.parse:parse":        {sequence: 71}
  "rptg.lang.cl.logic.schema:facts": {decisions: 33}
  # 30.09.2026, постройка build: свойства сборок упирались в фильтр Hypothesis (Э6 unknown у
  # app.billing и app) — границы не шли во вложенные поля и в элементы под forall. D переписанного
  # листа — до кода: конъюнкция 1, forall 1, переменная квантора 1; цель: len 1, путь из полей 1,
  # индекс в пути 1; сравнение с порядком 1, число слева 1, целое 1, есть цель 1, сторона 1, теснее 1;
  # обход требований 1 — 13. При проектировании, до кода, найден ещё класс: строгое сравнение у
  # нецелого пути (price > 0 давало min 1 и не порождало 0 < price < 1) — 14. Оговорка: черновик
  # тогда уже был прикинут (D_код ≈ 25 при допуске 24,5 для 13); измерено по коду D_код 24 — лист
  # уложился бы и в 13, поправка не подгонка (REVERSE-PTG-BUILD.md §2)
  "rptg.lang.cl.strategy.bounds:bounds": {decisions: 14}
  # rptg.check — D объявлено 28.09.2026 по карточкам до кода (А11, таблица —
  # REVERSE-PTG-CHECK.md §3 в корне рабочей папки); после кода сверяется с D_код.
  # 29.09.2026 после сверки с базой (мицелий, arch1, LB2): три новых класса поведения — закрытый
  # <think>, незакрытый <think> с ответом после него, блок без метки как запасной; 16 → 19, до кода
  "rptg.check.answer.raw:extract":       {decisions: 19}
  "rptg.check.answer.shape:jobs":        {decisions: 6}
  "rptg.check.answer.conds:jobs":        {decisions: 13}
  "rptg.check.answer.names:problems":    {decisions: 27}
  "rptg.check.answer.judge:form":        {decisions: 10}
  "rptg.check.graph.tree:check":         {decisions: 31}
  "rptg.check.graph.links:check":        {decisions: 26}
  "rptg.check.graph.outcome:structure":  {decisions: 4}
  "rptg.check.graph.reach:dead_ops":     {decisions: 12}
  "rptg.check.graph.impact:stale":       {decisions: 11}
