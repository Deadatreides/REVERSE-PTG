    - id: rptg.plan.machine.policy
      parent: rptg.plan.machine
      owner: rptg.plan.machine
      purpose: "политика элемента: деревья по умолчанию (LOGIC §7.3) и свои, валидатор, пошаговый исполнитель"
      uses: []
      effects: []
      allowed_imports: []
      est_lines: 170
      ops:
        - name: build
          doc: "у роли своя политика cfg.policies[роль] — её корень, иначе дерево по умолчанию: SEQ ступеней по длине лестницы роли и STOP(exhausted). Ступень 1 — CALL assigned [primary], CHECK, SWITCH violation_subtype {none → STOP(accepted), form → повторы формы, contract и semantic → починки} default CHECK. Ступень k > 1 — CALL next [primary + отчёт], CHECK, SWITCH violation_subtype {form → повторы формы} default CHECK, SWITCH same_failure {SAME → STOP(card_suspect)} default CHECK, SWITCH violation_subtype {none → STOP(accepted), contract и semantic → починки} default CHECK. Повторы формы (repair.form_retries штук) — SEQ[CALL same [alternative], CHECK, SWITCH violation_subtype {none → STOP(accepted), form → следующий повтор} default CHECK]; починки (repair.per_rung штук) — SEQ[CALL same [primary + отчёт], CHECK, SWITCH violation_subtype {none → STOP(accepted), form → повторы формы, contract и semantic → следующая починка} default CHECK]. Дерево extra — SEQ[CALL same [primary + отчёт], CHECK, SWITCH violation_subtype {none → STOP(accepted)} default STOP(user)]. problems пуст"
          params: [{name: cfg, type: Config}]
          result: Policies
          requires: []
          ensures: ["len(result.problems) == 0"]
          effects: []
          examples:
            - in: {cfg: *cfg}
              out:
                architect:
                  op: SEQ
                  children:
                    - op: SEQ
                      children:
                        - {op: CALL, operator: assigned, wording: primary, with_report: false}
                        - {op: CHECK}
                        - {op: SWITCH, obs: violation_subtype, default: {op: CHECK}}
                    - {op: STOP, reason: exhausted}
                extra: *m_extra
                problems: []
              source: model
              match: subset
        - name: check
          doc: "у каждого дерева (architect, designer, implementer, extra) обходом сверху вниз, путь в записи arch2; проблема — «роль: путь: что»: неизвестный узел; CALL — оператор не assigned, same, next и не оператор проекта, формулировка не primary и не alternative, за CALL в его SEQ нет CHECK; SEQ и PAR — пустой список детей, у SEQ узлы после STOP; SWITCH — неизвестная наблюдаемая, значение не из наблюдаемой, нет default, tokens_bucket вне BUDGET; BUDGET — лимит не положителен или нет child; STOP без причины. Итог — те же деревья и найденные проблемы"
          params: [{name: policies, type: Policies}, {name: cfg, type: Config}]
          result: Policies
          requires: []
          ensures: []
          effects: []
          examples:
            - in: {policies: {architect: *m_valid_tree, designer: *m_valid_tree, implementer: *m_valid_tree, extra: *m_extra, problems: []}, cfg: *cfg}
              out: {problems: []}
              source: model
              match: subset
            - in: {policies: {architect: *m_bad_tree, designer: *m_valid_tree, implementer: *m_valid_tree, extra: *m_extra, problems: []}, cfg: *cfg}
              out: {problems: ["architect: root/seq[0]: за CALL нет CHECK", "architect: root/seq[1]: нет default"]}
              source: model
              match: subset
        - name: step
          doc: "ответ пользователя и команда — none; сборка — без дерева: проверка не полна — check, принята — stop accepted, провал — stop blame; элемент ждёт пользователя — none. Дерево — extra при режиме extra, иначе роли. Вызов в позиции: хранимый путь на CALL — он, иначе исполнение от начала режима (reopen, resume, пусто — root) по наблюдаемым idle до первого CALL. dispatch — этот вызов; ответ модели — повтор оставляет его, unknown — stop unknown, иначе исполнение от следующего за ним узла; прогон — от хранимой позиции (CHECK) по наблюдаемым события. Исполнение: CHECK не полон — ждать; SEQ и PAR — первый ребёнок; SWITCH — ветвь значения или default; рамка BUDGET — расход наблюдаемых (позиция ищется по расходу до события, дальше — после): вход в исчерпанную рамку и приход к CALL под ней — stop budget, рамка ограничивает следующие вызовы, а не полученный ответ; STOP — stop с причиной; ветвь кончилась — следующий узел родителя, у PAR после провала ветви — следующая ветвь; конец дерева — accepted по приёмке, иначе exhausted. Приход к CALL: assigned — назначение элемента, same — текущий оператор, next — ступень + 1, если она не выше min(лестница, max_rung), иначе stop exhausted; имя оператора — он. Отчёт — with_report или первый вызов режима reopen"
          params: [{name: policies, type: Policies}, {name: state, type: Json}, {name: subject, type: string}, {name: obs, type: Obs}, {name: idle, type: Obs}, {name: manual, type: Override}, {name: event, type: string}, {name: assignments, type: Assignments}, {name: cfg, type: Config}]
          result: PolicyStep
          requires: []
          ensures: ['result.wait == "call" => result.rung >= 1']
          effects: []
          examples:
            - in: {policies: *m_policies, state: *s_new, subject: "map:app", obs: *m_obs_neutral, idle: *m_obs_neutral, manual: {}, event: dispatch, assignments: [*as_map], cfg: *cfg}
              out: {wait: call, path: "root/seq[0]/seq[0]", stop: "", operator: opus, rung: 1, wording: primary, report: false}
              source: model
            - in: {policies: *m_policies, state: *m_s_form_stored, subject: "map:app", obs: *m_obs_form, idle: *m_obs_neutral, manual: {}, event: model_answered, assignments: [], cfg: *cfg}
              out: {wait: call, path: "root/seq[0]/seq[2]/case[form]/seq[0]", stop: "", operator: opus, rung: 1, wording: alternative, report: false}
              source: model
            - in: {policies: *m_policies, state: *m_s_billing_stored, subject: "design:app.billing", obs: *m_obs_dep, idle: {<<: *m_obs_neutral, attempts: 1, work: design}, manual: {}, event: model_answered, assignments: [], cfg: *cfg}
              out: {wait: call, path: "root/seq[1]/seq[0]", stop: "", operator: grok, rung: 2, wording: primary, report: true}
              source: model
            - in: {policies: *m_policies, state: *m_s_map_exhaust, subject: "map:app", obs: {<<: *m_obs_form, subtype: dependency}, idle: {<<: *m_obs_neutral, subtype: form, attempts: 1, tokens: 6024}, manual: {}, event: model_answered, assignments: [], cfg: *cfg}
              out: {wait: stop, path: "root/seq[1]/seq[0]", stop: exhausted, operator: "", rung: 1, wording: primary, report: false}
              source: model
            - in: {policies: *m_policies_budget, state: *m_s_billing_stored, subject: "design:app.billing", obs: *m_obs_dep, idle: {<<: *m_obs_neutral, attempts: 1, work: design}, manual: {}, event: model_answered, assignments: [], cfg: *cfg}
              out: {wait: stop, path: "root/budget/seq[1]/seq[0]", stop: budget, operator: "", rung: 1, wording: primary, report: false}
              source: model

    - id: rptg.plan.machine.element
      parent: rptg.plan.machine
      owner: rptg.plan.machine
      purpose: "элемент после шага политики (LOGIC §7.2) и ответ пользователя или команда оболочки"
      uses: []
      effects: []
      allowed_imports: []
      est_lines: 105
      ops:
        - name: update
          doc: "шаг none — элемент как есть. Провал — отчёты и подтип провала; приёмка — отчётов нет, подтип none. Вызов: повтор — позиция и состояние прежние, запись repeat; иначе позиция шага, назначение — оператор и ступень шага, состояние: alternative — form_retry и form_retries + 1, ступень выше — escalated, иначе с отчётом — repairing, иначе planned. check — checking. stop: accepted — approval у разложения корня и узла с ручным approve, иначе accepted; unknown — checking и ожидание пользователя; exhausted, card_suspect, blame — card_suspect (следствия решает settle); прочая причина — card_suspect и ожидание пользователя. route — узел принятого разложения"
          params: [{name: state, type: Json}, {name: facts, type: EventFacts}, {name: obs, type: Obs}, {name: step, type: PolicyStep}, {name: reports, type: Json}, {name: manual, type: Override}, {name: design_hash, type: Sha}]
          result: Absorbed
          requires: []
