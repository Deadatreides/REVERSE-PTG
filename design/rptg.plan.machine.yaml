        - name: decide
          doc: "прочие события — как есть. Решение {decide, decision} по элементу, что ждёт пользователя: retry — элемент переоткрывается; revise — владелец (разложение родителя, у узла корня — корень) переоткрывается с отчётами элемента и комментарием, элемент ждёт владельца с прежней позицией. Перепроверка {recheck}: unknown на текущем хэше сняты, элемент stale с прежней позицией. Команда budget — новый лимит; на каждую команду — запись command"
