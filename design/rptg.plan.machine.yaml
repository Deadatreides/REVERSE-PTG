              source: model
              match: subset
            - in: {settled: *m_settled_done}
              out: *m_settled_done
              source: model
        - name: targets
          doc: "предметы перепроверки — устаревшие по check.stale и элементы в stale, без повторов, по порядку; снятые и ждущие утверждения пропускаются (их только что проверили, приёмку даёт пользователь); сборка — planned (прогон позже); карта с текстом, разложение с сохранённой версией и функция с кодом — в предметы, их элементы — stale; значение — карта (текст, карточка и типы корня), разложение без поля node, у функции — пустой объект; каноническую запись даст lang"
          params: [{name: settled, type: Settled}, {name: stale, type: Strings}]
          result: RecheckTargets
          requires: []
          ensures: ["len(result.values) == len(result.subjects)"]
          effects: []
          examples:
            - in: {settled: *m_settled_done, stale: []}
              out: {state: *m_s_design_done, subjects: [], values: []}
              source: model
            - in: {settled: *m_settled_done, stale: ["design:app.billing", "assembly:app.billing"]}
              out: {state: {elements: {"design:app.billing": {state: stale}, "assembly:app.billing": {state: planned}}}, subjects: ["design:app.billing"], values: [{children: [{id: app.billing.lines}]}]}
              source: model
              match: subset
            - in: {settled: {state: *m_s_map_stale, changed: [], notes: []}, stale: []}
              out: {subjects: ["map:app"], values: [{map_text: "# Карта app\n\nДва узла: накладные и деньги.\n", card: {id: app}, types: [{name: Money}, {name: InvoiceLine}, {name: Order}, {name: Invoice}]}]}
              source: model
              match: subset
            - in: {settled: {state: *m_s_owner, changed: [], notes: []}, stale: ["design:app"]}
              out: {state: {elements: {"design:app": {state: approval}}}, subjects: [], values: []}
              source: model
              match: subset
        - name: jobs
          doc: "событие ответа модели на предмет: задача — предмет, вид по предмету (map, design, function), роль и оператор назначения элемента (нет — первый лестницы роли), попытка элемента (не меньше 1), primary; ответ — у карты и разложения их каноническая запись, у функции код в блоке python; расход нулевой, finish_reason recheck"
          params: [{name: targets, type: RecheckTargets}, {name: texts, type: Strings}, {name: cfg, type: Config}]
          result: RecheckJobs
          requires: ["len(texts) == len(targets.subjects)"]
          ensures: ["len(result.events) == len(result.subjects)"]
          effects: []
          examples:
            - in: {targets: {state: *m_s_design_done, subjects: [], values: []}, texts: [], cfg: *cfg}
              out: {state: *m_s_design_done, events: [], subjects: []}
              source: model
            - in: {targets: {state: *m_s_design_done, subjects: ["design:app.billing"], values: [{}]}, texts: ["{}"], cfg: *cfg}
              out: {events: [{kind: model_answered, task: {subject: "design:app.billing", kind: design, role: designer, operator: gemini, attempt: 1, wording: primary}, answer: {text: "{}", input_tokens: 0, output_tokens: 0, cache_read_tokens: 0, finish_reason: recheck, refusal: false}}], subjects: ["design:app.billing"]}
              source: model
              match: subset
        - name: store
          doc: "доказательства каждого события — к его предмету; провалы по порядку"
          params: [{name: jobs, type: RecheckJobs}, {name: results, type: Json}]
          result: RecheckStored
          requires: []
          ensures: []
          effects: []
          examples:
            - in: {jobs: {state: *m_s_design_done, events: [], subjects: []}, results: []}
              out: {state: *m_s_design_done, failures: [], subjects: []}
              source: model
        - name: apply
          doc: "по предмету: принят — accepted; провал — переоткрыт с его отчётами, round 0; функция без провала статики — checking в режиме recheck (прогоны позже); unknown — ожидание пользователя; записи recheck"
          params: [{name: settled, type: Settled}, {name: stored, type: RecheckStored}, {name: acceptances, type: Acceptances}, {name: reports, type: Json}, {name: cfg, type: Config}]
          result: Settled
          requires: ["len(acceptances) == len(stored.subjects)"]
          ensures: []
          effects: []
          examples:
            - in: {settled: *m_settled_done, stored: {state: *m_s_design_done, failures: [], subjects: []}, acceptances: [], reports: [], cfg: *cfg}
              out: *m_settled_done
              source: model

    - id: rptg.plan.machine.close
      parent: rptg.plan.machine
      owner: rptg.plan.machine
      purpose: "фаза проекта и итог перехода"
      uses: []
      effects: []
      allowed_imports: []
      est_lines: 100
      ops:
        - name: phase
          doc: "фаза вперёд по состояниям (LOGIC §7.1): NEW → MAP с первым событием карты; разложение корня на утверждении — MAP_REVIEW; «нет» утверждения корня — MAP; «да» и дальше — DESIGN, пока есть непринятые разложения; BUILD — все разложения приняты; E2E — приняты функции и сборки кроме корня; DONE — принята сборка корня. PAUSED — команда pause или элемент ждёт пользователя из-за колебания, повтора состояния или бюджета задачи; из PAUSED выводит resume или ответ пользователя. DONE не меняется"
          params: [{name: before, type: Json}, {name: absorbed, type: Absorbed}, {name: settled, type: Settled}, {name: cfg, type: Config}]
          result: Json
          requires: []
          ensures: []
          effects: []
          examples:
            - in: {before: *s_map, absorbed: *p_abs_form, settled: {state: *p_s_map_form, changed: [], notes: []}, cfg: *cfg}
              out: {phase: MAP}
              source: model
              match: subset
        - name: journal
          doc: "итог: состояние после, доказательства события как есть; журнал — по записи evidence на доказательство события, записи впитывания и следствий, по записи state на каждый изменившийся элемент (предмет, было, стало) по порядку предметов, запись phase при смене фазы, запись budget при смене расхода, запись outcome на каждый элемент, пришедший в accepted, promoted или card_suspect"
          params: [{name: before, type: Json}, {name: after, type: Json}, {name: absorbed, type: Absorbed}, {name: settled, type: Settled}, {name: evidence, type: Json}]
          result: Json
          requires: []
          ensures: []
          effects: []
          examples:
            - in: {before: *s_map, after: *p_s_map_form, absorbed: *p_abs_form, settled: {state: *p_s_map_form, changed: [], notes: []}, evidence: [*ev_form_p1]}
              out: {evidence: [{check: P1, verdict: fail}], journal: [{kind: evidence, subject: "map:app"}, {kind: state, subject: "map:app"}]}
              source: model
              match: subset

  flows:
    absorb:
      nodes:
        - {id: n1, call: "intake:facts", args: {state: state, event: event, evidence: evidence, answer: answer, cfg: cfg}}
        - {id: n2, map: "check:report", over: n1.failures, item: e, args: {evidence: e, state: state}}
        - {id: n3, call: "lang:digest", args: {value: n1.text}}
        - {id: n4, call: "talk:cost", args: {answer: n1.raw, operator: n1.operator}}
        - {id: n5, call: "route:score", args: {state: state, ready: n1.ready, cfg: cfg}}
        - {id: n6, map: "route:fallback", over: n5, item: c, args: {candidate: c, cfg: cfg}}
        - {id: n7, call: "intake:store", args: {state: state, facts: n1, answer: answer, evidence: evidence, hash: n3, cost: n4, assignments: n6, cfg: cfg}}
        - {id: n8, call: "check:accepted", args: {state: n7, subject: n1.subject}}
        - {id: n9, call: "route:override", args: {subject: n1.subject, cfg: cfg}}
        - {id: n10, call: "policy:build", args: {cfg: cfg}}
        - {id: n11, call: "policy:check", args: {policies: n10, cfg: cfg}}
        - {id: n12, call: "intake:observe", args: {state: n7, facts: n1, reports: n2, acceptance: n8, hash: n3}}
        - {id: n13, call: "intake:idle", args: {state: state, subject: n1.subject, assignments: n6}}
        - {id: n14, call: "policy:step", args: {policies: n11, state: n7, subject: n1.subject, obs: n12, idle: n13, manual: n9, event: n1.event, assignments: n6, cfg: cfg}}
        - {id: n15, call: "lang:digest", args: {value: n1.design}}
        - {id: n16, call: "element:update", args: {state: n7, facts: n1, obs: n12, step: n14, reports: n2, manual: n9, design_hash: n15}}
        - {id: n17, call: "element:reply", args: {absorbed: n16, cfg: cfg}}
        - {id: n18, call: "element:decide", args: {absorbed: n17, cfg: cfg}}
      result: n18
    settle:
      nodes:
        - {id: n1, call: "settle:children", args: {absorbed: absorbed, kinds: kinds, cfg: cfg}}
        - {id: n4, call: "settle:revision", args: {before: before, settled: n1, absorbed: absorbed}}
        - {id: n2, call: "settle:suspect", args: {settled: n4, absorbed: absorbed, cfg: cfg}}
        - {id: n3, call: "settle:blame", args: {settled: n2, absorbed: absorbed, cfg: cfg}}
      result: n3
    recheck:
      nodes:
        - {id: n1, call: "check:dead_ops", args: {state: settled.state}}
        - {id: n2, call: "refresh:remove", args: {settled: settled, dead: n1, cfg: cfg}}
        - {id: n12, call: "refresh:types", args: {before: settled.state, settled: n2}}
        - {id: n13, call: "refresh:restart", args: {settled: n12}}
        - {id: n3, call: "check:stale", args: {state: n13.state, changed: n13.changed}}
        - {id: n4, call: "refresh:targets", args: {settled: n13, stale: n3}}
        - {id: n5, map: "lang:canonical", over: n4.values, item: v, args: {value: v}}
        - {id: n6, call: "refresh:jobs", args: {targets: n4, texts: n5, cfg: cfg}}
        - {id: n7, map: "check:evaluate", over: n6.events, item: ev, args: {state: n6.state, event: ev, cfg: cfg}}
        - {id: n8, call: "refresh:store", args: {jobs: n6, results: n7}}
        - {id: n9, map: "check:accepted", over: n8.subjects, item: s, args: {state: n8.state, subject: s}}
        - {id: n10, map: "check:report", over: n8.failures, item: e, args: {evidence: e, state: n8.state}}
        - {id: n11, call: "refresh:apply", args: {settled: n13, stored: n8, acceptances: n9, reports: n10, cfg: cfg}}
      result: n11
    close:
      nodes:
        - {id: n1, call: "close:phase", args: {before: before, absorbed: absorbed, settled: settled, cfg: cfg}}
        - {id: n2, call: "close:journal", args: {before: before, after: n1, absorbed: absorbed, settled: settled, evidence: evidence}}
      result: n2
    policies:
      nodes:
        - {id: n1, call: "policy:build", args: {cfg: cfg}}
        - {id: n2, call: "policy:check", args: {policies: n1, cfg: cfg}}
      result: n2
    dispatch:
      nodes:
        - {id: n1, call: "route:override", args: {subject: subject, cfg: cfg}}
        - {id: n2, call: "policy:build", args: {cfg: cfg}}
        - {id: n3, call: "policy:check", args: {policies: n2, cfg: cfg}}
        - {id: n4, call: "intake:idle", args: {state: state, subject: subject, assignments: assignments}}
        - {id: n5, call: "policy:step", args: {policies: n3, state: state, subject: subject, obs: n4, idle: n4, manual: n1, event: {const: dispatch}, assignments: assignments, cfg: cfg}}
      result: n5
