                absorbed: *m_abs_owner
              out: {state: {elements: {"design:app": {policy_path: "user:oscillation:", versions: ["ec480a51a953018aabf7689b4d36973fd203bd65c2d92701fa681914c27b047d", "dfa526aed093cc9e792d2dcd0b70b685742baea9b7d97abe7f59c7632149b582", "ec480a51a953018aabf7689b4d36973fd203bd65c2d92701fa681914c27b047d"]}}}, notes: [{kind: oscillation, subject: "design:app"}]}
