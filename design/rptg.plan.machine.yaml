                cfg: *cfg
              out: {state: {designs: {}, elements: {"map:app": {state: repairing, policy_path: "reopen:root", reports: [{expected: "деньги — отдельным узлом"}]}, "design:app": {state: planned, policy_path: ""}}}, route: ""}
              source: model
