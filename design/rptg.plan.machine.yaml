              out: {state: {elements: {"design:app.billing": {state: escalated, attempts: 1, last_subtype: dependency, reports: [*r_currency], assignment: {operator: grok, rung: 2}}}}}
              source: model
              match: subset
        - name: reply
          doc: "прочие события — как есть. Утверждение {approve, design_hash, decision}: элемент не на утверждении или дайджест не тот — запись stale_reply; yes — разложение принято, утверждение записано (версию записала ревизия по ответу модели), route — узел; no — разложение и карточки его детей сняты, элементы поддерева тоже (они принадлежали отвергнутой версии, следующая разведёт детей заново), отчёт с комментарием: у корня карта переоткрывается с ним, разложение корня — заново; у поддерева переоткрывается разложение"
