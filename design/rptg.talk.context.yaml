# Разложение rptg.talk.context — уровень 4. Факты задачи по правилу контекста LOGIC §8.1.
#
# Работ четыре — факты карты, разложения и функции, у каждой свои входы и своё правило «только
# перечисленное», и контекст починки (отчёт). Схема зовёт все (С-8), каждый лист на чужом виде
# задачи отвечает пустым списком разделов, слияние склеивает. Правило контекста как гарантия стоит
# и на каждом листе, и на операции узла: исполнитель не видит дерева, у карты — только замысел и
# приёмочные примеры, отчёт есть тогда и только тогда, когда он есть в задаче, прежнего ответа нет
# ни у кого (ключа для него нет, F1).
#
# Контекст починки — отдельный лист с 29.09.2026: Э1 показал у text:render 32 строки кода при
# пределе 30, и вторая работа там была эта — отчёт. По CONTEXT_MODEL он и есть слой контекста
# (REPAIR_CONTEXT), а не часть текста; в подсказку он идёт JSON, как в LOGIC §8.4.
#
# Отчёт идёт первым разделом, сразу после указания задачи (сверка с базой 29.09.2026): K1
# измерил у моделей 1–2B монотонный распад полноты нахождения по позиции записи — 0,609 на
# позиции 0 против 0,214 на позиции 17, — а отчёт в починке главное. Направление перенесено,
# число на подсказках rptg не мерено.
#
# Шаги split (design_r1–r3) получают факты разложения: пошаговое разложение вне MVP, как и в
# check (REVERSE-PTG-CHECK.md §2, находка 10) — нет типов ответа шага и места под черновик.
fixtures:
  map_sections: &map_sections "# Карта app {#app}\n\n## Накладные {#billing}\nСтроки и итог.\n\n### Итог\nСумма строк.\n\n## Деньги {#money}\nСложение.\n"
  s_mapsec: &s_mapsec
    <<: *s_billing
    map_text: *map_sections
  task_design_app: &task_design_app {subject: "design:app", kind: design, role: architect, operator: opus, attempt: 1, wording: primary}
  cfg_contract: &cfg_contract
    <<: *cfg
    contracts: {"app.billing.lines:line_total": {decisions: 2}}
  op_add_iface: &op_add_iface {name: add, doc: "сумма двух сумм одной валюты", params: [{name: a, type: Money}, {name: b, type: Money}], result: Money, requires: ["a.currency == b.currency"], ensures: ["result.amount == a.amount + b.amount", "result.currency == a.currency"], effects: []}
  op_lt_full: &op_lt_full {name: line_total, doc: "количество × цена, в валюте строки", params: [{name: line, type: InvoiceLine}], result: Money, requires: ["line.qty > 0", "line.price >= 0"], ensures: ["result.amount == line.qty * line.price", "result.currency == line.currency"], effects: [], examples: [{in: {line: {qty: 2, price: "10.00", currency: EUR}}, out: {amount: "20.00", currency: EUR}, source: model}]}
  f_idea: &f_idea {sections: [{key: idea, value: "накладные по заказам: строки, итог в валюте заказа"}, {key: examples, value: {"app:invoice": [*ex_user_7, *ex_user_8]}}]}
  f_empty: &f_empty {sections: []}

design:
  node: rptg.talk.context
  types: []

  children:
    - id: rptg.talk.context.idea
      parent: rptg.talk.context
      owner: rptg.talk.context
      purpose: "факты задачи карты: замысел и приёмочные примеры"
      uses: []
      effects: []
      allowed_imports: []
      est_lines: 15
      ops:
        - name: facts
          doc: "карта — разделы idea (замысел) и examples (примеры пользователя по операциям); другой вид задачи — пусто"
          params: [{name: task, type: Task}, {name: state, type: Json}]
          result: Facts
          requires: []
          ensures:
            - 'task.kind != "map" => len(result.sections) == 0'
            - 'forall s in result.sections: s.key in {"idea", "examples"}'
          effects: []
          examples:
            - {in: {task: *task_map, state: *s_new}, out: *f_idea, source: model}
            - {in: {task: *task_gguf, state: *s_build}, out: *f_empty, source: model}

    - id: rptg.talk.context.branch
      parent: rptg.talk.context
      owner: rptg.talk.context
      purpose: "факты задачи разложения узла X: карточка, путь от корня, раздел карты ветви, интерфейсы uses, видимые типы, пределы; у ревизии — ещё текущее разложение и отчёты поддерева"
      uses: []
      effects: []
      allowed_imports: []
      est_lines: 60
      ops:
        - name: facts
          doc: "разложение, ревизия и шаги split — разделы card (карточка X), path (строки «id — назначение» строгих предков от корня), map (у корня — вся карта; иначе раздел с заголовком, где есть {#имя} узла уровня 2 ветви, до заголовка того же или старшего уровня; нет — пустая строка), uses (карточки uses: id и операции без примеров), types (типы, чей владелец — X или его предок, по имени), limits (уровень X, max_depth, max_children, final_max_ops, k_lists); ревизия — ещё design (текущее разложение X) и below (предмет и отчёты элементов строго под X с отчётами, по предмету); другой вид — пусто"
          params: [{name: task, type: Task}, {name: state, type: Json}, {name: cfg, type: Json}]
          result: Facts
          requires: []
          ensures:
            - 'task.kind == "map" or task.kind == "function" => len(result.sections) == 0'
            - 'forall s in result.sections: s.key in {"card", "path", "map", "uses", "types", "limits", "design", "below"}'
            - 'task.kind != "revision" => forall s in result.sections: s.key != "design" and s.key != "below"'
          effects: []
          examples:
            - in: {task: *task_billing, state: *s_billing, cfg: *cfg}
              out:
                sections:
                  - {key: card, value: *c_billing}
                  - {key: path, value: ["app — накладные по заказам"]}
                  - {key: map, value: ""}
                  - {key: uses, value: [{id: app.money, ops: [*op_add_iface]}]}
                  - {key: types, value: [*t_invoice, *t_line, *t_money, *t_order]}
                  - {key: limits, value: {level: 2, max_depth: 8, max_children: 7, final_max_ops: 6, k_lists: 3}}
              source: model
            - in: {task: *task_billing, state: *s_mapsec, cfg: *cfg}
              out: {sections: [{key: card}, {key: path}, {key: map, value: "## Накладные {#billing}\nСтроки и итог.\n\n### Итог\nСумма строк."}, {key: uses}, {key: types}, {key: limits}]}
              source: model
              match: subset
            - in: {task: *task_design_app, state: *s_review, cfg: *cfg}
              out: {sections: [{key: card, value: *c_app}, {key: path, value: []}, {key: map, value: "# Карта app\n\nДва узла: накладные и деньги.\n"}, {key: uses, value: []}, {key: types}, {key: limits, value: {level: 1, max_depth: 8, max_children: 7, final_max_ops: 6, k_lists: 3}}]}
              source: model
              match: subset
            - in: {task: *task_rev, state: *s_rev, cfg: *cfg}
              out: {sections: [{key: card}, {key: path}, {key: map}, {key: uses}, {key: types}, {key: limits}, {key: design, value: *d_billing}, {key: below, value: [{subject: "function:app.billing.lines:line_total", reports: [*r_lt]}]}]}
              source: model
              match: subset
            - {in: {task: *task_gguf, state: *s_build, cfg: *cfg}, out: *f_empty, source: model}

    - id: rptg.talk.context.leaf
      parent: rptg.talk.context
      owner: rptg.talk.context
      purpose: "факты задачи функции: карточка одной операции, назначение узла, её типы, импорты и эффекты узла, пределы Э1"
      uses: []
      effects: []
      allowed_imports: []
      est_lines: 45
      ops:
        - name: facts
          doc: "функция — разделы op (карточка операции из предмета, с примерами), purpose (назначение узла), types (типы проекта из параметров и результата, запись [T] — тип T, с замыканием по ссылкам $ref внутри схем, по имени), imports (allowed_imports и effects узла), limits (max_complexity проекта и договор Э1 операции, если объявлен); другой вид — пусто"
          params: [{name: task, type: Task}, {name: state, type: Json}, {name: cfg, type: Json}]
          result: Facts
          requires: []
          ensures:
            - 'task.kind != "function" => len(result.sections) == 0'
            - 'forall s in result.sections: s.key in {"op", "purpose", "types", "imports", "limits"}'
          effects: []
          examples:
            - in: {task: *task_gguf, state: *s_build, cfg: *cfg}
              out:
                sections:
                  - {key: op, value: *op_lt_full}
                  - {key: purpose, value: "стоимость строки накладной"}
                  - {key: types, value: [*t_line, *t_money]}
                  - {key: imports, value: {allowed_imports: [decimal], effects: []}}
                  - {key: limits, value: {max_complexity: 10}}
              source: model
            - in: {task: *task_gguf, state: *s_build, cfg: *cfg_contract}
              out: {sections: [{key: op}, {key: purpose}, {key: types}, {key: imports}, {key: limits, value: {max_complexity: 10, decisions: 2}}]}
              source: model
              match: subset
            - {in: {task: *task_billing, state: *s_billing, cfg: *cfg}, out: *f_empty, source: model}

    - id: rptg.talk.context.repair
      parent: rptg.talk.context
      owner: rptg.talk.context
      purpose: "контекст починки (REPAIR_CONTEXT, CONTEXT_MODEL §4): отчёт о нарушении из задачи — самодостаточный, без прежнего ответа"
      uses: []
      effects: []
      allowed_imports: []
      est_lines: 12
      ops:
        - name: facts
          doc: "у задачи есть отчёт — раздел report с ним как есть; нет — пусто. Задача приходит в JSON: отчёт уже записан так, как его покажет подсказка (LOGIC §8.4)"
          params: [{name: task, type: Json}]
          result: Facts
          requires: []
          ensures: ["len(result.sections) <= 1", 'forall s in result.sections: s.key == "report"']
          effects: []
          examples:
            - {in: {task: *task_repair}, out: {sections: [{key: report, value: *r_currency}]}, source: model}
            - {in: {task: *task_billing}, out: *f_empty, source: model}

    - id: rptg.talk.context.merge
      parent: rptg.talk.context
      owner: rptg.talk.context
      purpose: "склейка фактов в порядке отчёт, карта, разложение, функция"
      uses: []
      effects: []
      allowed_imports: []
      est_lines: 12
      ops:
        - name: facts
          doc: "разделы отчёта, затем карты, разложения и функции — подряд; из трёх последних на деле непуст один. Отчёт первым: полнота нахождения у малых моделей падает с позицией монотонно (K1)"
          params: [{name: idea, type: Facts}, {name: branch, type: Facts}, {name: leaf, type: Facts}, {name: repair, type: Facts}]
          result: Facts
          requires: []
          ensures: ["len(result.sections) == len(idea.sections) + len(branch.sections) + len(leaf.sections) + len(repair.sections)"]
          effects: []
          examples:
            - in: {idea: *f_idea, branch: *f_empty, leaf: *f_empty, repair: *f_empty}
              out: *f_idea
              source: model
            - in: {idea: *f_empty, branch: {sections: [{key: card, value: {id: x}}]}, leaf: *f_empty, repair: {sections: [{key: report, value: {layer: P4}}]}}
              out: {sections: [{key: report, value: {layer: P4}}, {key: card, value: {id: x}}]}
              source: model

  flows:
    facts:
      nodes:
        - {id: n1, call: "idea:facts", args: {task: task, state: state}}
        - {id: n2, call: "branch:facts", args: {task: task, state: state, cfg: cfg}}
        - {id: n3, call: "leaf:facts", args: {task: task, state: state, cfg: cfg}}
        - {id: n4, call: "repair:facts", args: {task: task}}
        - {id: n5, call: "merge:facts", args: {idea: n1, branch: n2, leaf: n3, repair: n4}}
      result: n5
