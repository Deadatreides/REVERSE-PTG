              purpose: {type: string}
              imports: {type: string}
              design: {type: string}
              below: {type: string}
              report: {type: string}
    - name: PromptTexts
      owner: rptg.talk
      doc: "тексты подсказок по версиям; версия оператора выбирает свои"
      schema: {type: object, additionalProperties: {$ref: Texts}}

  children:
    - id: rptg.talk.context
      parent: rptg.talk
      owner: rptg.talk
      purpose: "факты задачи из состояния по правилу контекста LOGIC §8.1 и контекст починки: только перечисленное для вида задачи, без прежнего ответа"
      uses: []
      effects: []
      allowed_imports: []
      est_lines: 150
      ops:
        - name: facts
          doc: "карта — замысел и приёмочные примеры; разложение X — карточка X, путь от корня строкой «id — назначение» на предка, раздел карты ветви (у корня — вся карта; раздел — заголовок с {#имя} уровня 2 до заголовка того же или старшего уровня), интерфейсы uses без примеров, типы владельцев-предков и самого X по имени, пределы с уровнем X; ревизия — ещё текущее разложение X и отчёты элементов поддерева X; шаги split — как разложение; функция — карточка операции, назначение узла, её типы с замыканием по ссылкам, импорты и эффекты узла, предел сложности и договор Э1, если объявлен; у задачи с отчётом — первым разделом отчёт"
          params: [{name: task, type: Task}, {name: state, type: Json}, {name: cfg, type: Json}]
          result: Facts
          requires: []
          ensures:
            - 'task.kind == "map" => forall s in result.sections: s.key in {"idea", "examples", "report"}'
            - 'task.kind == "function" => forall s in result.sections: s.key in {"op", "purpose", "types", "imports", "limits", "report"}'
            - 'task.kind != "revision" => forall s in result.sections: s.key != "design" and s.key != "below"'
            - 'task.report != null => exists s in result.sections: s.key == "report"'
            - 'task.report == null => forall s in result.sections: s.key != "report"'
          effects: []
          examples:
            - in: {task: *task_map, state: *s_new, cfg: *cfg}
              out: {sections: [{key: idea, value: "накладные по заказам: строки, итог в валюте заказа"}, {key: examples, value: {"app:invoice": [*ex_user_7, *ex_user_8]}}]}
              source: model
            - in: {task: *task_gguf, state: *s_build, cfg: *cfg}
              out:
                sections:
                  - key: op
                    value: {name: line_total, doc: "количество × цена, в валюте строки", params: [{name: line, type: InvoiceLine}], result: Money, requires: ["line.qty > 0", "line.price >= 0"], ensures: ["result.amount == line.qty * line.price", "result.currency == line.currency"], effects: [], examples: [{in: {line: {qty: 2, price: "10.00", currency: EUR}}, out: {amount: "20.00", currency: EUR}, source: model}]}
                  - {key: purpose, value: "стоимость строки накладной"}
                  - {key: types, value: [*t_line, *t_money]}
                  - {key: imports, value: {allowed_imports: [decimal], effects: []}}
                  - {key: limits, value: {max_complexity: 10}}
              source: model
            - in: {task: *task_billing, state: *s_billing, cfg: *cfg}
              out:
                sections:
                  - {key: card, value: *c_billing}
                  - {key: path, value: ["app — накладные по заказам"]}
                  - {key: map, value: ""}
                  - {key: uses, value: [{id: app.money, ops: [{name: add, doc: "сумма двух сумм одной валюты", params: [{name: a, type: Money}, {name: b, type: Money}], result: Money, requires: ["a.currency == b.currency"], ensures: ["result.amount == a.amount + b.amount", "result.currency == a.currency"], effects: []}]}]}
                  - {key: types, value: [*t_invoice, *t_line, *t_money, *t_order]}
                  - {key: limits, value: {level: 2, max_depth: 8, max_children: 7, final_max_ops: 6, k_lists: 3}}
              source: model
            - in: {task: *task_rev, state: *s_rev, cfg: *cfg}
              out: {sections: [{key: card}, {key: path}, {key: map}, {key: uses}, {key: types}, {key: limits}, {key: design, value: *d_billing}, {key: below, value: [{subject: "function:app.billing.lines:line_total", reports: [*r_lt]}]}]}
              source: model
              match: subset
            - in: {task: *task_repair, state: *s_billing, cfg: *cfg}
              out: {sections: [{key: report, value: *r_currency}, {key: card}, {key: path}, {key: map}, {key: uses}, {key: types}, {key: limits}]}
              source: model
              match: subset

    - id: rptg.talk.schema
      parent: rptg.talk
      owner: rptg.talk
      purpose: "схема ответа задачи — та же, по которой проверяет П1: записи закрыты, ссылки — на $defs"
      uses: []
      effects: []
      allowed_imports: [json]
      est_lines: 45
      ops:
        - name: answer
          doc: "карта — MapAnswer, разложение, ревизия и шаги split — Design, функция — null (ответ — блок python). Замыкание типов по ссылкам из схем корня; каждая запись с properties закрыта (additionalProperties: false) — как в П1; ссылка {$ref: Имя} → {$ref: #/$defs/Имя}; сам тип — вверху, остальные — в $defs"
          params: [{name: task, type: Task}]
          result: Json
          requires: []
          ensures: ['task.kind == "function" => result == null', 'task.kind != "function" => result != null']
          effects: []
          examples:
            - {in: {task: *task_gguf}, out: null, source: model}
            - in: {task: *task_billing}
              out: {type: object, required: [node, children, types, flows], additionalProperties: false, properties: {node: {$ref: "#/$defs/NodeId"}, children: {type: array, items: {$ref: "#/$defs/NodeCard"}}}}
              source: model
              match: subset
            - in: {task: *task_map}
              out: {type: object, required: [map_text, card, types], additionalProperties: false}
              source: model
              match: subset

    - id: rptg.talk.text
      parent: rptg.talk
      owner: rptg.talk
      purpose: "текст подсказки по текстам версии оператора: устойчивый префикс (правила роли, язык условий, договор ответа по способу вывода, схема) и тело (указание по формулировке, факты, строки починки)"
      uses: []
      effects: []
      allowed_imports: [json]
      est_lines: 50
      ops:
        - name: render
          doc: "тексты — texts[версия оператора]; префикс — общие строки, правила группы вида (ревизия и шаги split — группа разложения), строки языка условий, договор ответа: для функции — code, иначе договор способа, строка closed и схема JSON с ключами по порядку; тело — указание вида по формулировке (у другой формулировки — ещё строка формы), разделы фактов с заголовками (пустые значения пропускаются; строка — как есть, иначе JSON с отступом 1), после раздела отчёта — строки починки. Префикс не зависит ни от формулировки, ни от отчёта — кэш держится на повторах"
          params: [{name: task, type: Task}, {name: facts, type: Facts}, {name: schema, type: Json}, {name: mode, type: string}, {name: cfg, type: Config}, {name: texts, type: Json}]
          result: PromptText
          requires: ["task.operator in cfg.operators"]
          ensures: ["len(result.prefix) >= 1", "len(result.body) >= 1"]
          effects: []
          examples:
            - in:
                task: *task_gguf
                facts: {sections: [{key: op, value: {name: line_total}}, {key: purpose, value: "стоимость"}, {key: types, value: []}]}
                schema: null
                mode: grammar
                cfg: *cfg
                texts: *texts_tiny
              out:
                prefix: "role implementer\nfunction rules\ncl\npython block"
                body: "implement line_total of app.billing.lines\n\n## O\n{\n \"name\": \"line_total\"\n}\n\n## N\nстоимость"
                version: p1
              source: model
            - in:
                task: *task_repair
                facts: {sections: [{key: card, value: {id: app.billing}}, {key: report, value: {layer: P4, expected: "a.currency == b.currency"}}]}
                schema: {type: object}
                mode: json_schema
                cfg: *cfg
                texts: *texts_tiny
              out:
                prefix: "role designer\ndesign rules\ncl\nas json\nschema:\n{\"type\": \"object\"}"
                body: "split app.billing\n\n## C\n{\n \"id\": \"app.billing\"\n}\n\n## R\n{\n \"layer\": \"P4\",\n \"expected\": \"a.currency == b.currency\"\n}\n\nfix it"
                version: p1
              source: model
            - in:
                task: *task_alt
                facts: {sections: [{key: card, value: {id: app.billing}}]}
                schema: {type: object}
                mode: json_schema
                cfg: *cfg
                texts: *texts_tiny
              out:
                prefix: "role designer\ndesign rules\ncl\nas json\nschema:\n{\"type\": \"object\"}"
                body: "split app.billing again\n\nform first\n\n## C\n{\n \"id\": \"app.billing\"\n}"
                version: p1
              source: model
            - {in: {task: *task_map, facts: {sections: [{key: idea, value: "накладные"}]}, schema: {type: object}, mode: tool, cfg: *cfg, texts: *prompt_texts}, out: {version: p1}, source: model, match: subset}

    - id: rptg.talk.wire
      parent: rptg.talk
      owner: rptg.talk
      purpose: "протоколы поставщиков: какой способ вывода доступен, тело запроса по протоколу SDK, разбор конверта ответа"
      uses: []
      effects: []
      allowed_imports: [json]
      est_lines: 150
      ops:
        - name: mode
          doc: "способ вывода запроса. Функция — grammar, если его просит оператор и поставщик умеет (llamacpp), иначе prompt. Ответ JSON — первый доступный поставщику способ из предпочтений: json_schema → json_schema, tool, prompt; tool → tool, json_schema, prompt; grammar → grammar, json_schema, tool, prompt; prompt → prompt. Доступны: anthropic — tool, prompt (строгий json_schema не вмещает ответов rptg); openai, openrouter, openai_compatible — json_schema, tool, prompt; google — json_schema, prompt; llamacpp — grammar, json_schema, prompt"
          params: [{name: task, type: Task}, {name: cfg, type: Config}]
          result: string
          requires: ["task.operator in cfg.operators"]
          ensures:
            - 'result in {"json_schema", "tool", "grammar", "prompt"}'
            - 'task.kind == "function" => result == "grammar" or result == "prompt"'
          effects: []
          examples:
            - {in: {task: *task_map, cfg: *cfg}, out: tool, source: model}
            - {in: {task: *task_billing, cfg: *cfg}, out: json_schema, source: model}
            - {in: {task: *task_gguf, cfg: *cfg}, out: grammar, source: model}
            - {in: {task: *task_mini_fn, cfg: *cfg_talk}, out: prompt, source: model}
            - {in: {task: *task_gguf_design, cfg: *cfg_talk}, out: grammar, source: model}
            - {in: {task: *task_gpt, cfg: *cfg_talk}, out: tool, source: model}
            - {in: {task: *task_claude_p, cfg: *cfg_talk}, out: prompt, source: model}
        - name: payload
          doc: "запрос по протоколу поставщика, ключей нет. Префикс — системная часть (у anthropic — блок с меткой кэша ephemeral), тело — сообщение пользователя. anthropic: tool — инструмент answer со схемой и tool_choice auto (принудительный выбор задают params: новые модели его не принимают). openai, openrouter, openai_compatible: json_schema — response_format со схемой без strict, tool — функция answer и выбор её; endpoint — у openrouter свой, у openai_compatible — base_url оператора. google: json_schema — response_mime_type application/json и response_json_schema в config. llamacpp: функция в grammar — GBNF одного блока python, JSON-ответ в grammar и json_schema — response_format со схемой. params оператора — поверх, как есть (у google — в config)"
          params: [{name: prompt, type: Prompt}, {name: task, type: Task}, {name: mode, type: string}, {name: cfg, type: Config}]
          result: ProviderRequest
          requires: ["task.operator in cfg.operators"]
          ensures: ["result.operator == task.operator", "result.mode == mode"]
          effects: []
          examples:
            - in: {prompt: *p_map, task: *task_map, mode: tool, cfg: *cfg_talk}
              out:
                provider: anthropic
                operator: opus
                mode: tool
                payload:
                  model: claude-opus-5
                  system: [{type: text, text: "Правила метода rptg для роли архитектора. Ответ — только JSON по схеме.", cache_control: {type: ephemeral}}]
                  messages: [{role: user, content: "Замысел: накладные по заказам: строки, итог в валюте заказа."}]
                  tools: [{name: answer, description: "The answer of the task: one JSON object of the answer schema.", input_schema: {type: object}}]
                  tool_choice: {type: auto}
                  max_tokens: 32000
              source: model
            - in: {prompt: *p_map, task: *task_local, mode: json_schema, cfg: *cfg_talk}
              out:
                provider: openai_compatible
                operator: local
                mode: json_schema
                endpoint: "http://127.0.0.1:8080/v1"
                payload:
                  model: qwen-coder
                  messages: [{role: system, content: "Правила метода rptg для роли архитектора. Ответ — только JSON по схеме."}, {role: user, content: "Замысел: накладные по заказам: строки, итог в валюте заказа."}]
                  response_format: {type: json_schema, json_schema: {name: answer, schema: {type: object}, strict: false}}
              source: model
            - in: {prompt: *p_map, task: *task_gpt, mode: tool, cfg: *cfg_talk}
              out:
                provider: openai
                operator: gpt
                mode: tool
                payload:
                  model: gpt-model
                  messages: [{role: system, content: "Правила метода rptg для роли архитектора. Ответ — только JSON по схеме."}, {role: user, content: "Замысел: накладные по заказам: строки, итог в валюте заказа."}]
                  tools: [{type: function, function: {name: answer, description: "The answer of the task: one JSON object of the answer schema.", parameters: {type: object}}}]
                  tool_choice: {type: function, function: {name: answer}}
              source: model
            - in: {prompt: *p_map, task: *task_billing, mode: json_schema, cfg: *cfg_talk}
              out:
                provider: google
                operator: gemini
                mode: json_schema
                payload:
                  model: gemini-model
                  contents: [{role: user, parts: [{text: "Замысел: накладные по заказам: строки, итог в валюте заказа."}]}]
                  config: {system_instruction: "Правила метода rptg для роли архитектора. Ответ — только JSON по схеме.", response_mime_type: application/json, response_json_schema: {type: object}}
              source: model
            - in: {prompt: *p_fn, task: *task_gguf, mode: grammar, cfg: *cfg_talk}
              out:
                provider: llamacpp
                operator: gguf
                mode: grammar
                payload:
                  model: qwen2.5-coder-7b-instruct-q4_k_m
                  messages: [{role: system, content: "Правила метода rptg для роли исполнителя. Ответ — один блок python."}, {role: user, content: "Реализуй line_total узла app.billing.lines."}]
                  grammar: "root ::= \"```python\\n\" [^`]* \"```\""
              source: model
            - in: {prompt: *p_fn, task: *task_mini_fn, mode: prompt, cfg: *cfg_talk}
              out:
                provider: openrouter
                operator: mini
                mode: prompt
                endpoint: "https://openrouter.ai/api/v1"
                payload:
                  model: openai/mini-model
                  messages: [{role: system, content: "Правила метода rptg для роли исполнителя. Ответ — один блок python."}, {role: user, content: "Реализуй line_total узла app.billing.lines."}]
              source: model
        - name: read
          doc: "конверт → текст, токены, причина, отказ; содержимое не разбирается. Текст: у anthropic — вход первого вызова инструмента в JSON, иначе блоки text подряд (блоки мышления пропускаются); у openai-подобных (openai, openrouter, openai_compatible, llamacpp) — аргументы первого вызова функции, иначе content; у google — аргументы вызова функции в JSON, иначе текстовые части без мыслей. Входные токены — по полной цене: у anthropic input_tokens и запись в кэш, у openai-подобных и google — вход минус прочитанное из кэша, не меньше нуля; прочитанное из кэша — отдельно; выход google — кандидаты и мысли. Отказ: stop_reason refusal (anthropic), поле refusal или content_filter (openai-подобные), причина блокировки подсказки или причина остановки SAFETY, RECITATION, BLOCKLIST, PROHIBITED_CONTENT, SPII, IMAGE_SAFETY (google) — тогда finish_reason refusal; иначе finish_reason поставщика как есть"
          params: [{name: provider, type: string}, {name: raw, type: Json}]
          result: RawAnswer
          requires: ['provider in {"anthropic", "openai", "google", "openrouter", "openai_compatible", "llamacpp"}']
          ensures:
            - "result.input_tokens >= 0 and result.output_tokens >= 0"
            - 'result.refusal => result.finish_reason == "refusal"'
          effects: []
          examples:
            - in: {provider: anthropic, raw: *raw_a_tool}
              out: {text: '{"ok": 1}', input_tokens: 350, output_tokens: 20, cache_read_tokens: 4000, finish_reason: tool_use, refusal: false}
              source: model
            - in:
                provider: anthropic
                raw: {id: msg_2, type: message, role: assistant, content: [], stop_reason: refusal, usage: {input_tokens: 300, output_tokens: 0}}
              out: {text: "", input_tokens: 300, output_tokens: 0, cache_read_tokens: 0, finish_reason: refusal, refusal: true}
              source: model
            - in: {provider: openai, raw: *raw_o_tool}
              out: {text: '{"ok": 1}', input_tokens: 476, output_tokens: 30, cache_read_tokens: 1024, finish_reason: stop, refusal: false}
              source: model
            - in: {provider: openrouter, raw: *raw_o_refusal}
              out: {text: "", input_tokens: 400, output_tokens: 9, cache_read_tokens: 0, finish_reason: refusal, refusal: true}
              source: model
            - in: {provider: google, raw: *raw_g}
              out: {text: '{"ok": 1}', input_tokens: 500, output_tokens: 340, cache_read_tokens: 1500, finish_reason: STOP, refusal: false}
              source: model
            - in: {provider: google, raw: *raw_g_blocked}
              out: {text: "", input_tokens: 120, output_tokens: 0, cache_read_tokens: 0, finish_reason: refusal, refusal: true}
              source: model
            - in: {provider: llamacpp, raw: *raw_l}
              out: {text: "```python\ndef f():\n    return 1\n```", input_tokens: 700, output_tokens: 25, cache_read_tokens: 0, finish_reason: stop, refusal: false}
              source: model

    - id: rptg.talk.price
      parent: rptg.talk
      owner: rptg.talk
      purpose: "цена ответа точной десятичной арифметикой без модуля decimal: целые с масштабом"
      uses: []
      effects: []
      allowed_imports: []
      est_lines: 35
      ops:
        - name: cost
          doc: "(вход × input + выход × output + прочитанное из кэша × cache) / 10⁶; нет цены кэша — чтение из кэша по цене входа. Счёт в целых с общим масштабом, запись — десятичная без хвостовых нулей, ноль — «0». Запись в кэш у Anthropic идёт по цене входа: надбавки в Price нет"
          params: [{name: answer, type: RawAnswer}, {name: operator, type: Operator}]
          result: Decimal
          requires: []
          ensures: ["result >= 0"]
          effects: []
          examples:
            - in:
                answer: {text: "", input_tokens: 1000, output_tokens: 100, cache_read_tokens: 0, finish_reason: stop, refusal: false}
                operator: {id: priced, provider: openrouter, model: some-model, output_mode: json_schema, steps: combined, prices: {input: "3", output: "15"}, prompt_version: p1}
              out: "0.0045"
              source: model
            - in:
                answer: {text: "", input_tokens: 200, output_tokens: 50, cache_read_tokens: 1000, finish_reason: end_turn, refusal: false}
                operator: {id: opus, provider: anthropic, model: claude-opus-5, output_mode: tool, steps: combined, prices: {input: "5", output: "25", cache: "0.50"}, prompt_version: p1}
              out: "0.00275"
              source: model
            - in:
                answer: {text: "", input_tokens: 800, output_tokens: 60, cache_read_tokens: 0, finish_reason: stop, refusal: false}
                operator: {id: gguf, provider: llamacpp, model: qwen, output_mode: grammar, steps: split, prices: {input: "0", output: "0"}, prompt_version: p1}
              out: "0"
              source: model

  flows:
    prompt:
      nodes:
        - {id: n1, call: "context:facts", args: {task: task, state: state, cfg: cfg}}
        - {id: n2, call: "schema:answer", args: {task: task}}
        - {id: n3, call: "wire:mode", args: {task: task, cfg: cfg}}
        - {id: n4, call: "text:render", args: {task: task, facts: n1, schema: n2, mode: n3, cfg: cfg, texts: {const: *prompt_texts}}}
        - {id: n5, call: "lang:digest", args: {value: n4.prefix}}
        - {id: n6, record: Prompt, fields: {prefix: n4.prefix, body: n4.body, version: n4.version, answer_schema: n2, cache_key: n5}}
      result: n6
    request:
      nodes:
        - {id: n1, call: "wire:mode", args: {task: task, cfg: cfg}}
        - {id: n2, call: "wire:payload", args: {prompt: prompt, task: task, mode: n1, cfg: cfg}}
      result: n2
    response:
      nodes: [{id: n1, call: "wire:read", args: {provider: provider, raw: raw}}]
      result: n1
    cost:
      nodes: [{id: n1, call: "price:cost", args: {answer: answer, operator: operator}}]
      result: n1
