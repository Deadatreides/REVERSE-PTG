  ev_b_p2: &ev_b_p2 {check: P2, subject: "design:app.billing", subject_hash: "6e6b074722195d91cf3471b1e39dcd34b441b8347e8bc42fd16516db4485086e", hard: true, verdict: pass, details: {}, tool: networkx, trusted: true}
  ev_b_p3: &ev_b_p3 {check: P3, subject: "design:app.billing", subject_hash: "6e6b074722195d91cf3471b1e39dcd34b441b8347e8bc42fd16516db4485086e", hard: true, verdict: pass, details: {}, tool: jsonsubschema, trusted: true}
  ev_b_p4: &ev_b_p4
    check: P4
