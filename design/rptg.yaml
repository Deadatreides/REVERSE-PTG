# rptg по собственному методу: выход архитектора — карточка корня и разложение корня.
# Текст карты с эскизом всей сети — map.md. Типы — types.yaml. Проверка — tools/selfcheck.py.
#
# fixtures — данные для примеров (якоря YAML). Карточками они не являются; всё, что из них
# попадает в примеры, проверяется по типам. Предметная область примеров — программа накладных
# app из LOGIC.md §2.6: сквозной пример метода стал приёмочным примером самого rptg.
# Места вида @@ИМЯ@@ — хэши, их вписывает tools/selfcheck.py --fill.

fixtures:
  # ── настройки ──
  cfg: &cfg
    limits: {max_depth: 8, max_children: 7, final_max_ops: 6, final_max_lines: 40, max_complexity: 10, k_lists: 3, z3_rlimit: 5000000, hypothesis_examples: 200}
    roles:
      architect: [opus]
      designer: [gemini, grok, opus]
      implementer: [gguf, mini, gemini, opus]
    operators:
      opus:   {id: opus, provider: anthropic, model: claude-opus-5, output_mode: json_schema, steps: combined, prices: {input: "0", output: "0"}, prompt_version: p1}
      gemini: {id: gemini, provider: google, model: gemini-model, output_mode: json_schema, steps: combined, prices: {input: "0", output: "0"}, prompt_version: p1}
      grok:   {id: grok, provider: openrouter, model: x-ai/grok-model, output_mode: json_schema, steps: combined, prices: {input: "0", output: "0"}, prompt_version: p1}
      mini:   {id: mini, provider: openrouter, model: openai/mini-model, output_mode: json_schema, steps: combined, prices: {input: "0", output: "0"}, prompt_version: p1}
      gguf:   {id: gguf, provider: llamacpp, model: qwen2.5-coder-7b-instruct-q4_k_m, output_mode: grammar, steps: split, prices: {input: "0", output: "0"}, prompt_version: p1}
    routing: {target: 0.8, n_min: 10, prior_bands: {designer: [45, 70], implementer: [30, 55, 75]}, adapt: false, explore: 0.0}
    repair: {per_rung: 1, form_retries: 2}
    overrides: {}
  cfg_manual: &cfg_manual
    <<: *cfg
    overrides:
      "app.billing.**": {implementer: gemini}
  table_empty: &table_empty {cells: [], g0: false}
  table_compute: &table_compute
    g0: true
    cells:
      - {operator: gguf, class: compute, n_fit: 6, ok_fit: 3, n_check: 6, ok_check: 3, cost_per_success: "0", low_data: false}
      - {operator: mini, class: compute, n_fit: 6, ok_fit: 5, n_check: 6, ok_check: 5, cost_per_success: "0.0021", low_data: false}
      - {operator: gemini, class: compute, n_fit: 6, ok_fit: 6, n_check: 6, ok_check: 6, cost_per_success: "0.0180", low_data: false}

  # ── типы программы накладных ──
  sch_decimal: &sch_decimal {type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$"}
  sch_money: &sch_money
    type: object
    required: [amount, currency]
    properties: {amount: {$ref: Decimal}, currency: {type: string, enum: [EUR, USD]}}
  sch_line: &sch_line
    type: object
    required: [qty, price, currency]
    properties: {qty: {type: integer}, price: {$ref: Decimal}, currency: {type: string, enum: [EUR, USD]}}
  sch_order: &sch_order
    type: object
    required: [id, lines]
    properties: {id: {type: integer}, lines: {type: array, items: {$ref: InvoiceLine}}}
  sch_invoice: &sch_invoice
    type: object
    required: [order_id, total]
    properties: {order_id: {type: integer}, total: {$ref: Money}}
  t_money: &t_money {name: Money, owner: app, schema: *sch_money}
  t_line: &t_line {name: InvoiceLine, owner: app, schema: *sch_line}
  t_order: &t_order {name: Order, owner: app, schema: *sch_order}
  t_invoice: &t_invoice {name: Invoice, owner: app, schema: *sch_invoice}
  env_line: &env_line
    types: {Decimal: *sch_decimal, Money: *sch_money, InvoiceLine: *sch_line}
    vars: {line: InvoiceLine, result: Money}
  env_money: &env_money
    types: {Decimal: *sch_decimal, Money: *sch_money}
    vars: {a: Money, b: Money, result: Money}
  env_order: &env_order
    types: {Decimal: *sch_decimal, Money: *sch_money, InvoiceLine: *sch_line, Order: *sch_order, Invoice: *sch_invoice}
    vars: {order: Order}
  env_x: &env_x {types: {}, vars: {x: integer}}

  # ── карточки программы накладных ──
  ex_user_7: &ex_user_7 {in: {order: {id: 7, lines: [{qty: 2, price: "10.00", currency: EUR}]}}, out: {order_id: 7, total: {amount: "20.00", currency: EUR}}, source: user}
  ex_user_8: &ex_user_8 {in: {order: {id: 8, lines: [{qty: 1, price: "3.50", currency: EUR}, {qty: 3, price: "1.00", currency: EUR}]}}, out: {order_id: 8, total: {amount: "6.50", currency: EUR}}, source: user}
  c_app: &c_app
    id: app
    owner: app
    purpose: "накладные по заказам"
    uses: []
    effects: []
    allowed_imports: [decimal]
    est_lines: 80
    ops:
      - name: invoice
        doc: "накладная по заказу"
        params: [{name: order, type: Order}]
        result: Invoice
        requires: ["len(order.lines) >= 1", "forall l in order.lines: l.qty > 0 and l.price >= 0"]
        ensures: ["result.order_id == order.id"]
        effects: []
        examples: [*ex_user_7, *ex_user_8]
  c_app_fixed: &c_app_fixed
    <<: *c_app
    ops:
      - name: invoice
        doc: "накладная по заказу"
        params: [{name: order, type: Order}]
        result: Invoice
        requires: ["len(order.lines) >= 1", "forall l in order.lines: l.qty > 0 and l.price >= 0", "forall l in order.lines: l.currency == order.lines[0].currency"]
        ensures: ["result.order_id == order.id"]
        effects: []
        examples: [*ex_user_7, *ex_user_8]
  c_billing: &c_billing
    id: app.billing
    parent: app
    owner: app
    purpose: "накладные по подтверждённым заказам"
    uses: [app.money]
    effects: []
    allowed_imports: [decimal]
    est_lines: 40
    ops:
      - name: make_invoice
        doc: "накладная по заказу: строки, итог"
        params: [{name: order, type: Order}]
        result: Invoice
        requires: ["len(order.lines) >= 1", "forall l in order.lines: l.qty > 0 and l.price >= 0"]
        ensures: ["result.order_id == order.id", "result.total.amount >= 0"]
        effects: []
        examples:
          - {in: {order: {id: 7, lines: [{qty: 2, price: "10.00", currency: EUR}]}}, out: {order_id: 7, total: {amount: "20.00", currency: EUR}}, source: model}
  c_billing_fixed: &c_billing_fixed
    <<: *c_billing
    ops:
      - name: make_invoice
        doc: "накладная по заказу: строки, итог"
        params: [{name: order, type: Order}]
        result: Invoice
        requires: ["len(order.lines) >= 1", "forall l in order.lines: l.qty > 0 and l.price >= 0", "forall l in order.lines: l.currency == order.lines[0].currency"]
        ensures: ["result.order_id == order.id", "result.total.amount >= 0"]
        effects: []
        examples:
          - {in: {order: {id: 7, lines: [{qty: 2, price: "10.00", currency: EUR}]}}, out: {order_id: 7, total: {amount: "20.00", currency: EUR}}, source: model}
  op_add: &op_add
    name: add
    doc: "сумма двух сумм одной валюты"
    params: [{name: a, type: Money}, {name: b, type: Money}]
    result: Money
    requires: ["a.currency == b.currency"]
    ensures: ["result.amount == a.amount + b.amount", "result.currency == a.currency"]
    effects: []
    examples:
      - {in: {a: {amount: "1.00", currency: EUR}, b: {amount: "2.50", currency: EUR}}, out: {amount: "3.50", currency: EUR}, source: model}
  c_money: &c_money
    id: app.money
    parent: app
    owner: app
    purpose: "денежные суммы"
    uses: []
    effects: []
    allowed_imports: [decimal]
    est_lines: 8
    ops: [*op_add]
  c_money2: &c_money2
    <<: *c_money
    est_lines: 16
    ops:
      - *op_add
      - name: sub
        doc: "разность сумм одной валюты"
        params: [{name: a, type: Money}, {name: b, type: Money}]
        result: Money
        requires: ["a.currency == b.currency"]
        ensures: ["result.amount == a.amount - b.amount", "result.currency == a.currency"]
        effects: []
        examples:
          - {in: {a: {amount: "3.00", currency: EUR}, b: {amount: "1.00", currency: EUR}}, out: {amount: "2.00", currency: EUR}, source: model}
  c_lines: &c_lines
    id: app.billing.lines
    parent: app.billing
    owner: app.billing
    purpose: "стоимость строки накладной"
    uses: []
    effects: []
    allowed_imports: [decimal]
    est_lines: 5
    ops:
      - name: line_total
        doc: "количество × цена, в валюте строки"
        params: [{name: line, type: InvoiceLine}]
        result: Money
        requires: ["line.qty > 0", "line.price >= 0"]
        ensures: ["result.amount == line.qty * line.price", "result.currency == line.currency"]
        effects: []
        examples:
          - {in: {line: {qty: 2, price: "10.00", currency: EUR}}, out: {amount: "20.00", currency: EUR}, source: model}
  flows_app: &flows_app
    invoice:
      nodes: [{id: n1, call: "billing:make_invoice", args: {order: order}}]
      result: n1
  d_app: &d_app {node: app, children: [*c_billing, *c_money], types: [*t_money, *t_line, *t_order, *t_invoice], flows: *flows_app}
  d_app_fixed: &d_app_fixed {node: app, children: [*c_billing_fixed, *c_money], types: [*t_money, *t_line, *t_order, *t_invoice], flows: *flows_app}
  d_app2: &d_app2 {node: app, children: [*c_billing_fixed, *c_money2], types: [*t_money, *t_line, *t_order, *t_invoice], flows: *flows_app}
  d_billing: &d_billing
    node: app.billing
    children: [*c_lines]
    types: []
    flows:
      make_invoice:
        nodes:
          - {id: n0, record: Money, fields: {amount: {const: "0"}, currency: "order.lines[0].currency"}}
          - {id: n1, map: lines, over: order.lines, item: line}
          - {id: n2, fold: "money:add", over: n1, init: n0, acc: a, item: b}
          - {id: n3, record: Invoice, fields: {order_id: order.id, total: n2}}
        result: n3
  code_lt: &code_lt "def line_total(line: InvoiceLine) -> Money:\n    return Money(amount=line.qty * line.price, currency=line.currency)\n"
  code_add: &code_add "def add(a: Money, b: Money) -> Money:\n    return Money(amount=a.amount + b.amount, currency=a.currency)\n"

  # ── назначения, задачи, события ──
  as_map: &as_map {subject: "map:app", role: architect, class: map, operator: opus, rung: 1, decided_by: rule}
  as_design_app: &as_design_app {subject: "design:app", role: architect, class: map, operator: opus, rung: 1, decided_by: rule}
  as_billing: &as_billing {subject: "design:app.billing", role: designer, class: design, operator: gemini, rung: 1, decided_by: prior}
  task_map: &task_map {subject: "map:app", kind: map, role: architect, operator: opus, attempt: 1, wording: primary}
  task_billing: &task_billing {subject: "design:app.billing", kind: design, role: designer, operator: gemini, attempt: 1, wording: primary}
  task_gguf: &task_gguf {subject: "function:app.billing.lines:line_total", kind: function, role: implementer, operator: gguf, attempt: 1, wording: primary}
  r_currency: &r_currency
    subject: "design:app.billing"
    layer: P4
    rule: I13
    where: "схема make_invoice, узел n2: свёртка money:add по n1, шаг 1, параметр b"
    fragment: "{id: n2, fold: money:add, over: n1, init: n0, acc: a, item: b}"
    expected: "a.currency == b.currency"
    counterexample: {"order.lines[0].currency": EUR, "order.lines[1].currency": USD}
    means: "требование вызываемой операции не гарантировано выше по потоку"
  # значения контрпримера выбирает Z3 — в примерах, которые гонят решатель, они «*» (map.md §12)
  r_currency_any: &r_currency_any
    <<: *r_currency
    counterexample: {"order.lines[0].currency": "*", "order.lines[1].currency": "*"}
  task_repair: &task_repair {subject: "design:app.billing", kind: design, role: designer, operator: gemini, attempt: 2, wording: primary, report: *r_currency}
  e_form: &e_form
    kind: model_answered
    task: *task_map
    answer: {text: "Сейчас подумаю над архитектурой.", input_tokens: 3000, output_tokens: 12, cache_read_tokens: 0, finish_reason: end_turn, refusal: false}
  billing_answer: &billing_answer |
    {"children": [{"id": "app.billing.lines", "parent": "app.billing", "owner": "app.billing",
       "purpose": "стоимость строки накладной", "uses": [], "effects": [], "allowed_imports": ["decimal"],
       "est_lines": 5,
       "ops": [{"name": "line_total", "doc": "количество × цена, в валюте строки",
                "params": [{"name": "line", "type": "InvoiceLine"}], "result": "Money",
                "requires": ["line.qty > 0", "line.price >= 0"],
                "ensures": ["result.amount == line.qty * line.price", "result.currency == line.currency"],
                "effects": [],
                "examples": [{"in": {"line": {"qty": 2, "price": "10.00", "currency": "EUR"}},
                              "out": {"amount": "20.00", "currency": "EUR"}, "source": "model"}]}]}],
     "types": [],
     "flows": {"make_invoice": {"nodes": [
        {"id": "n0", "record": "Money", "fields": {"amount": {"const": "0"}, "currency": "order.lines[0].currency"}},
        {"id": "n1", "map": "lines", "over": "order.lines", "item": "line"},
        {"id": "n2", "fold": "money:add", "over": "n1", "init": "n0", "acc": "a", "item": "b"},
        {"id": "n3", "record": "Invoice", "fields": {"order_id": "order.id", "total": "n2"}}],
        "result": "n3"}}}
  e_billing: &e_billing
    kind: model_answered
    task: *task_billing
    answer: {text: *billing_answer, input_tokens: 5200, output_tokens: 900, cache_read_tokens: 4000, finish_reason: stop, refusal: false}

  # ── доказательства ──
  ev_form_p1: &ev_form_p1 {check: P1, subject: "map:app", subject_hash: "84270e8c63f680c22e81fbb2c0128e6a96ada42e3bcece79dfa16500c3190376", hard: true, verdict: fail, details: {reason: "в ответе нет блока JSON"}, tool: extract, trusted: true}
