    details: {rule: I13, op: make_invoice, node: n2, step: 1, param: b, where: "схема make_invoice, узел n2: свёртка money:add по n1, шаг 1, параметр b", fragment: "{id: n2, fold: money:add, over: n1, init: n0, acc: a, item: b}", expected: "a.currency == b.currency", obligation: "n2__acc1.currency == n1[1].currency"}
    counterexample: {"order.lines[0].currency": EUR, "order.lines[1].currency": USD}
    tool: z3
    trusted: true
  ev_b_p5: &ev_b_p5 {check: P5, subject: "design:app.billing", subject_hash: "6e6b074722195d91cf3471b1e39dcd34b441b8347e8bc42fd16516db4485086e", hard: true, verdict: pass, details: {}, tool: z3, trusted: true}
  ev_b_p7: &ev_b_p7 {check: P7, subject: "design:app.billing", subject_hash: "6e6b074722195d91cf3471b1e39dcd34b441b8347e8bc42fd16516db4485086e", hard: true, verdict: pass, details: {}, tool: cl, trusted: true}
  evs_billing: &evs_billing [*ev_b_p1, *ev_b_p2, *ev_b_p3, *ev_b_p4, *ev_b_p5, *ev_b_p7]
  evs_fixed: &evs_fixed
    - {check: P1, subject: "design:app.billing", subject_hash: "7577349a4fa92fc4f84627e1aa9c20d094e933203a81240e39eb0a556d896f6d", hard: true, verdict: pass, details: {}, tool: jsonschema, trusted: true}
    - {check: P2, subject: "design:app.billing", subject_hash: "7577349a4fa92fc4f84627e1aa9c20d094e933203a81240e39eb0a556d896f6d", hard: true, verdict: pass, details: {}, tool: networkx, trusted: true}
    - {check: P3, subject: "design:app.billing", subject_hash: "7577349a4fa92fc4f84627e1aa9c20d094e933203a81240e39eb0a556d896f6d", hard: true, verdict: pass, details: {}, tool: jsonsubschema, trusted: true}
    - {check: P4, subject: "design:app.billing", subject_hash: "7577349a4fa92fc4f84627e1aa9c20d094e933203a81240e39eb0a556d896f6d", hard: true, verdict: pass, details: {}, tool: z3, trusted: true}
    - {check: P5, subject: "design:app.billing", subject_hash: "7577349a4fa92fc4f84627e1aa9c20d094e933203a81240e39eb0a556d896f6d", hard: true, verdict: pass, details: {}, tool: z3, trusted: true}
    - {check: P7, subject: "design:app.billing", subject_hash: "7577349a4fa92fc4f84627e1aa9c20d094e933203a81240e39eb0a556d896f6d", hard: true, verdict: pass, details: {}, tool: cl, trusted: true}

  # ── состояния ──
  el_map_ok: &el_map_ok {subject: "map:app", kind: map, state: accepted, assignment: *as_map, attempts: 1, form_retries: 0, reports: [], answer_hashes: []}
  el_app_ok: &el_app_ok {subject: "design:app", kind: design, state: accepted, assignment: *as_design_app, attempts: 1, form_retries: 0, reports: [], answer_hashes: []}
