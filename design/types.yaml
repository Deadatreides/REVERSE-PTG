# Типы rptg, созданные архитектором (задача «К карта» и разложение корня).
# Владелец всех типов — узел rptg: они видны во всём дереве.
#
# Запись — подмножество JSON Schema. Ссылка на именованный тип — {$ref: Имя}.
# Три поправки к языку типов, которых потребовало самоописание (map.md §7, находка С-2):
#   Json            — непрозрачное значение: CL внутрь не заглядывает;
#   словарь         — object с additionalProperties;
#   oneOf строка|объект — только для записи источника в схеме потока (Source).
# Имена string, integer, number, boolean в параметрах — простые типы.

# ── основа ──────────────────────────────────────────────────────────────────
NodeId:
  doc: путь узла от корня через точку
  schema: {type: string, pattern: "^[a-z_][a-z0-9_]*(\\.[a-z_][a-z0-9_]*)*$"}
OpRef:
  doc: операция — узел:операция
  schema: {type: string, pattern: "^[a-z_][a-z0-9_]*(\\.[a-z_][a-z0-9_]*)*:[a-z_][a-z0-9_]*$"}
Subject:
  doc: предмет работы — вид:узел или вид:узел:операция
  schema: {type: string, pattern: "^(map|design|function|assembly):[a-z_][a-z0-9_.]*(:[a-z_][a-z0-9_]*)?$"}
Cl:
  doc: текст условия на языке CL
  schema: {type: string, minLength: 1}
Sha:
  doc: SHA-256 канонической записи, шестнадцатерично
  schema: {type: string, pattern: "^[0-9a-f]{64}$"}
Decimal:
  doc: десятичное число записью
  schema: {type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$"}
Json:
  doc: непрозрачное значение JSON
  schema: {}
Strings:
  doc: список строк
  schema: {type: array, items: {type: string}}
StrMap:
  doc: словарь строка → строка
  schema: {type: object, additionalProperties: {type: string}}
Effect:
  doc: объявленный эффект операции
  schema: {type: string, enum: [fs.read, fs.write, stdout, clock, random]}
Role:
  doc: роль в конвейере
  schema: {type: string, enum: [architect, designer, implementer]}
WorkClass:
  doc: класс работы для маршрутизации (LOGIC §6.3)
  schema: {type: string, enum: [map, design, io, compute, search, text, transform]}
Check:
  doc: слой проверки
  schema: {type: string, enum: [P1, P2, P3, P4, P5, P7, E1, E2, E3, E6]}
Checks:
  doc: список слоёв
  schema: {type: array, items: {$ref: Check}}
Verdict:
  doc: вердикт проверки
  schema: {type: string, enum: [pass, fail, unknown]}
Phase:
  doc: фаза проекта (LOGIC §7.1)
  schema: {type: string, enum: [NEW, MAP, MAP_CHECK, MAP_REVIEW, DESIGN, BUILD, E2E, DONE, PAUSED]}
ElementKind:
  doc: вид элемента работы
  schema: {type: string, enum: [map, design, function, assembly]}
ElementState:
  doc: состояние элемента (LOGIC §7.2)
  schema: {type: string, enum: [planned, writing, checking, approval, form_retry, repairing, escalated, promoted, card_suspect, accepted, stale]}

# ── карточки и разложения ───────────────────────────────────────────────────
Example:
  doc: пример операции; match subset сравнивает только указанные поля, строка "*" — любое значение
  schema:
    type: object
    required: [in, out, source]
    properties:
      in: {$ref: Json}
      out: {$ref: Json}
      source: {type: string, enum: [user, model]}
      match: {type: string, enum: [exact, subset]}
Param:
  doc: параметр операции
  schema:
    type: object
    required: [name, type]
    properties: {name: {type: string}, type: {type: string}}
Params:
  doc: список параметров
  schema: {type: array, items: {$ref: Param}}
Op:
  doc: операция узла
  schema:
    type: object
    required: [name, doc, params, result, requires, ensures, effects, examples]
    properties:
      name: {type: string, pattern: "^[a-z_][a-z0-9_]*$"}
      doc: {type: string}
      params: {$ref: Params}
      result: {type: string}
      requires: {type: array, items: {$ref: Cl}}
      ensures: {type: array, items: {$ref: Cl}}
      effects: {type: array, items: {$ref: Effect}}
      examples: {type: array, items: {$ref: Example}}
Override:
  doc: ручное назначение на узел или маску (LOGIC §6.6)
  schema:
    type: object
    properties:
      kind: {type: string, enum: [final, composite]}
      designer: {type: string}
      implementer: {type: string}
      start_rung: {type: integer, minimum: 1}
      max_rung: {type: integer, minimum: 1}
      approve: {type: boolean}
      steps: {type: string, enum: [combined, split]}
      est_lines: {type: integer, minimum: 1}
      max_lines: {type: integer, minimum: 1}
      max_complexity: {type: integer, minimum: 1}
NodeCard:
  doc: карточка узла — пишет тот, кто раскладывал родителя
  schema:
    type: object
    required: [id, owner, purpose, uses, effects, allowed_imports, est_lines, ops]
    properties:
      id: {$ref: NodeId}
      parent: {$ref: NodeId}
      owner: {$ref: NodeId}
      purpose: {type: string}
      uses: {type: array, items: {$ref: NodeId}}
      effects: {type: array, items: {$ref: Effect}}
      allowed_imports: {type: array, items: {type: string}}
      est_lines: {type: integer, minimum: 1}
      ops: {type: array, items: {$ref: Op}, minItems: 1}
TypeDef:
  doc: именованный тип
  schema:
    type: object
    required: [name, owner, schema]
    properties: {name: {type: string}, owner: {$ref: NodeId}, doc: {type: string}, schema: {$ref: Json}}
TypeDefs:
  doc: список типов
  schema: {type: array, items: {$ref: TypeDef}}
Source:
  doc: источник значения — путь строкой или литерал {const}
  schema:
    oneOf:
      - {type: string, minLength: 1}
      - {type: object, required: [const], properties: {const: {$ref: Json}}}
FlowNode:
  doc: узел схемы потока — ровно одно из call, map, fold, record
  schema:
    type: object
    required: [id]
    properties:
      id: {type: string}
      call: {type: string}
      map: {type: string}
      fold: {type: string}
      record: {type: string}
      over: {$ref: Source}
      init: {$ref: Source}
      acc: {type: string}
      item: {type: string}
      args: {type: object, additionalProperties: {$ref: Source}}
      fields: {type: object, additionalProperties: {$ref: Source}}
Flow:
  doc: схема потока одной операции составного узла
  schema:
    type: object
    required: [nodes, result]
    properties:
      nodes: {type: array, items: {$ref: FlowNode}}
      result: {$ref: Source}
Design:
  doc: разложение составного узла
  schema:
    type: object
    required: [node, children, types, flows]
    properties:
      node: {$ref: NodeId}
      children: {type: array, items: {$ref: NodeCard}}
      types: {$ref: TypeDefs}
      flows: {type: object, additionalProperties: {$ref: Flow}}
      objection: {type: string}
MapAnswer:
  doc: ответ задачи «К карта» (LOGIC §8.1) — текст карты с разделами {#id}, карточка корня, типы корня
  schema:
    type: object
    required: [map_text, card, types]
    properties: {map_text: {type: string}, card: {$ref: NodeCard}, types: {$ref: TypeDefs}}

# ── доказательства ──────────────────────────────────────────────────────────
Evidence:
  doc: результат одной проверки; время проверки пишет оболочка, ядро часов не видит
  schema:
    type: object
    required: [check, subject, subject_hash, hard, verdict, details, tool, trusted]
    properties:
      check: {$ref: Check}
      subject: {type: string}
      subject_hash: {$ref: Sha}
      hard: {type: boolean}
      verdict: {$ref: Verdict}
      details: {$ref: Json}
      counterexample: {$ref: Json}
      tool: {type: string}
      trusted: {type: boolean}
Evidences:
  doc: список доказательств в порядке слоёв P1 P2 P3 P4 P5 P7 E1 E2 E3 E6
  schema: {type: array, items: {$ref: Evidence}}
Report:
  doc: отчёт о нарушении для починки — самодостаточен, прежний ответ не нужен (LOGIC §8.4)
  schema:
    type: object
    required: [subject, layer, rule, where, expected, means]
    properties:
      subject: {type: string}
      layer: {$ref: Check}
      rule: {type: string}
      where: {type: string}
      fragment: {type: string}
      expected: {type: string}
      counterexample: {$ref: Json}
      means: {type: string}
Acceptance:
  doc: принят ли предмет и каких доказательств не хватает
  schema:
    type: object
    required: [accepted, missing]
    properties: {accepted: {type: boolean}, missing: {$ref: Checks}}

# ── настройки и маршрутизация ───────────────────────────────────────────────
Price:
  doc: цены за миллион токенов
  schema:
    type: object
    required: [input, output]
    properties: {input: {$ref: Decimal}, output: {$ref: Decimal}, cache: {$ref: Decimal}}
Operator:
  doc: профиль оператора — модель, адаптер, настройки, версия подсказок
  schema:
    type: object
    required: [id, provider, model, output_mode, steps, prices, prompt_version]
    properties:
      id: {type: string}
      provider: {type: string, enum: [anthropic, openai, google, openrouter, openai_compatible, llamacpp]}
      model: {type: string}
      base_url: {type: string}
      output_mode: {type: string, enum: [json_schema, tool, grammar, prompt]}
      steps: {type: string, enum: [combined, split]}
      prices: {$ref: Price}
      params: {$ref: Json}
      prompt_version: {type: string}
Limits:
  doc: пределы проекта; z3_rlimit — детерминированный предел решателя вместо тайм-аута
  schema:
    type: object
    required: [max_depth, max_children, final_max_ops, final_max_lines, max_complexity, k_lists, z3_rlimit, hypothesis_examples]
    properties:
      max_depth: {type: integer, minimum: 1}
      max_children: {type: integer, minimum: 1}
      final_max_ops: {type: integer, minimum: 1}
      final_max_lines: {type: integer, minimum: 1}
      max_complexity: {type: integer, minimum: 1}
      k_lists: {type: integer, minimum: 1}
      z3_rlimit: {type: integer, minimum: 1}
      hypothesis_examples: {type: integer, minimum: 1}
Roles:
  doc: лестницы операторов по ролям, от дешёвого к сильному
  schema:
    type: object
    required: [architect, designer, implementer]
    properties:
      architect: {type: array, items: {type: string}, minItems: 1}
      designer: {type: array, items: {type: string}, minItems: 1}
      implementer: {type: array, items: {type: string}, minItems: 1}
Routing:
  doc: правила маршрутизации (LOGIC §6.4–§6.8)
  schema:
    type: object
    required: [target, n_min, prior_bands, adapt, explore]
    properties:
      target: {type: number, minimum: 0, maximum: 1}
      n_min: {type: integer, minimum: 1}
      prior_bands:
        type: object
        required: [designer, implementer]
        properties:
          designer: {type: array, items: {type: integer}}
          implementer: {type: array, items: {type: integer}}
      adapt: {type: boolean}
      explore: {type: number, minimum: 0, maximum: 1}
RepairPolicy:
  doc: попытки починки (LOGIC §7.3)
  schema:
    type: object
    required: [per_rung, form_retries]
    properties: {per_rung: {type: integer, minimum: 0}, form_retries: {type: integer, minimum: 0}}

# ── политика элемента: язык комплексов arch2 (arch2/SPEC.md §1.1, LOGIC §7.3) ──
Observable:
  doc: наблюдаемая величина политики — закрытый список, считается механически по элементу (arch2 SPEC §1.2)
  schema: {type: string, enum: [violation_subtype, same_failure, attempts_used, work_class, tokens_bucket]}
ViolationSubtype:
  doc: подтип нарушения — ось, по которой в опытах различались барьеры (arch2 REPORT §2.3)
  schema: {type: string, enum: [none, form, contract, dependency, semantic, value, other]}
PolicyNode:
  doc: узел политики — CALL, CHECK, SEQ, PAR, SWITCH, BUDGET, STOP; циклов и рекурсии нет, иначе нет статической оценки стоимости
  schema:
    type: object
    required: [op]
    properties:
      op: {type: string, enum: [CALL, CHECK, SEQ, PAR, SWITCH, BUDGET, STOP]}
      operator: {type: string}
      wording: {type: string, enum: [primary, alternative]}
      with_report: {type: boolean}
      children: {type: array, items: {$ref: PolicyNode}}
      obs: {$ref: Observable}
      cases: {type: object, additionalProperties: {$ref: PolicyNode}}
      default: {$ref: PolicyNode}
      limit_tokens: {type: integer, minimum: 1}
      child: {$ref: PolicyNode}
      reason: {type: string}
Policy:
  doc: политика роли — генотип; данные, а не код; выбирается по журналу повтором без токенов
  schema:
    type: object
    required: [policy_id, root]
    properties: {policy_id: {type: string}, root: {$ref: PolicyNode}}
LeafContract:
  doc: договор операции листа для Э1 (LOGIC §5) — decisions — договорное число решений, объявленное до кода; sequence — прямолинейные шаги, которых требует договор
  schema:
    type: object
    properties:
      decisions: {type: integer, minimum: 0}
      sequence: {type: integer, minimum: 0}
Config:
  doc: настройки проекта из project.yaml; trusted — проверки, прошедшие свои контрольные случаи при запуске, его заполняет оболочка по selftest (нет поля — доверенных нет)
  schema:
    type: object
    required: [limits, roles, operators, routing, repair, overrides]
    properties:
      limits: {$ref: Limits}
      roles: {$ref: Roles}
      operators: {type: object, additionalProperties: {$ref: Operator}}
      routing: {$ref: Routing}
      repair: {$ref: RepairPolicy}
      overrides: {type: object, additionalProperties: {$ref: Override}}
      policies: {type: object, additionalProperties: {$ref: Policy}}
      contracts: {type: object, additionalProperties: {$ref: LeafContract}}
      trusted: {$ref: Checks}
Cell:
  doc: клетка таблицы компетенций
  schema:
    type: object
    required: [operator, class, n_fit, ok_fit, n_check, ok_check, cost_per_success, low_data]
    properties:
      operator: {type: string}
      class: {$ref: WorkClass}
      n_fit: {type: integer, minimum: 0}
      ok_fit: {type: integer, minimum: 0}
      n_check: {type: integer, minimum: 0}
      ok_check: {type: integer, minimum: 0}
      cost_per_success: {$ref: Decimal}
      low_data: {type: boolean}
Competence:
  doc: таблица компетенций; g0 — у разных родов разные победители
  schema:
    type: object
    required: [cells, g0]
    properties: {cells: {type: array, items: {$ref: Cell}}, g0: {type: boolean}}
Candidate:
  doc: готовая к работе задача до выбора оператора
  schema:
    type: object
    required: [subject, kind, role, class, prior, level]
    properties:
      subject: {$ref: Subject}
      kind: {$ref: ElementKind}
      role: {$ref: Role}
      class: {$ref: WorkClass}
      prior: {type: integer, minimum: 0, maximum: 100}
      level: {type: integer, minimum: 1}
Candidates:
  doc: список кандидатов в порядке очереди
  schema: {type: array, items: {$ref: Candidate}}
Assignment:
  doc: назначение оператора и источник решения
  schema:
    type: object
    required: [subject, role, class, operator, rung, decided_by]
    properties:
      subject: {$ref: Subject}
      role: {$ref: Role}
      class: {$ref: WorkClass}
      operator: {type: string}
      rung: {type: integer, minimum: 1}
      decided_by: {type: string, enum: [rule, manual, table, prior, adapt, promotion]}
Assignments:
  doc: список назначений
  schema: {type: array, items: {$ref: Assignment}}

# ── конвейер ────────────────────────────────────────────────────────────────
Budget:
  doc: бюджет проекта в деньгах
  schema:
    type: object
    required: [limit, spent]
    properties: {limit: {$ref: Decimal}, spent: {$ref: Decimal}}
Element:
  doc: элемент работы и его история, нужная для эскалации, раннего подозрения и остановок; tokens и cost — расход элемента (BUDGET, tokens_bucket, строка исходов LOGIC §6.8); versions — хэши принятых версий разложения (колебание, §7.8); round — сколько раз владелец оставил карточку (повтор состояния, §7.8)
  schema:
    type: object
    required: [subject, kind, state, attempts, form_retries, reports, answer_hashes]
    properties:
      subject: {$ref: Subject}
      kind: {$ref: ElementKind}
      state: {$ref: ElementState}
      assignment: {$ref: Assignment}
      attempts: {type: integer, minimum: 0}
      form_retries: {type: integer, minimum: 0}
      reports: {type: array, items: {$ref: Report}}
      answer_hashes: {type: array, items: {$ref: Sha}}
      policy_path: {type: string}
      last_subtype: {$ref: ViolationSubtype}
      tokens: {type: integer, minimum: 0}
      cost: {$ref: Decimal}
      versions: {type: array, items: {$ref: Sha}}
      round: {type: integer, minimum: 0}
State:
  doc: состояние проекта — всё, что восстанавливается из журнала
  schema:
    type: object
    required: [phase, idea, map_text, cards, designs, types, code, evidence, elements, approvals, user_examples, budget]
    properties:
      phase: {$ref: Phase}
      idea: {type: string}
      map_text: {type: string}
      cards: {type: object, additionalProperties: {$ref: NodeCard}}
      designs: {type: object, additionalProperties: {$ref: Design}}
      types: {type: object, additionalProperties: {$ref: TypeDef}}
      code: {type: object, additionalProperties: {type: string}}
      evidence: {type: object, additionalProperties: {$ref: Evidences}}
      elements: {type: object, additionalProperties: {$ref: Element}}
      approvals: {type: object, additionalProperties: {$ref: Sha}}
      user_examples: {type: object, additionalProperties: {type: array, items: {$ref: Example}}}
      budget: {$ref: Budget}
Task:
  doc: работа для одного вызова модели
  schema:
    type: object
    required: [subject, kind, role, operator, attempt, wording]
    properties:
      subject: {$ref: Subject}
      kind: {type: string, enum: [map, design, design_r1, design_r2, design_r3, function, revision]}
      role: {$ref: Role}
      operator: {type: string}
      attempt: {type: integer, minimum: 1}
      wording: {type: string, enum: [primary, alternative]}
      report: {$ref: Report}
Action:
  doc: что оболочка делает дальше
  schema:
    type: object
    required: [kind]
    properties:
      kind: {type: string, enum: [call_model, run_sandbox, ask_user, pause, stop]}
      task: {$ref: Task}
      target: {$ref: BuildTarget}
      run: {type: string, enum: [e1_mypy, e2_e3, e6, smoke]}
      question: {$ref: Json}
      reason: {type: string}
RawAnswer:
  doc: ответ модели после разбора конверта поставщика
  schema:
    type: object
    required: [text, input_tokens, output_tokens, cache_read_tokens, finish_reason, refusal]
    properties:
      text: {type: string}
      input_tokens: {type: integer, minimum: 0}
      output_tokens: {type: integer, minimum: 0}
      cache_read_tokens: {type: integer, minimum: 0}
      finish_reason: {type: string}
      refusal: {type: boolean}
Answer:
  doc: ответ модели после извлечения — вид, предмет, узел, извлечённое значение (карта, разложение) или код функции; ok — удалось ли извлечь, иначе error — почему; truncated — ответ оборван пределом длины, это не ошибка модели. С 30.09.2026 тип корня (был в rptg.check) — его читает plan, чтобы записать принятое в состояние
  schema:
    type: object
    required: [ok, kind, subject, node, truncated]
    properties:
      ok: {type: boolean}
      kind: {type: string, enum: [map, design, design_step, function, none]}
      subject: {type: string}
      node: {type: string}
      op: {type: string}
      value: {$ref: Json}
      code: {type: string}
      truncated: {type: boolean}
      error: {type: string}
SandboxOutput:
  doc: итог прогона в песочнице; report — структурный отчёт, который пишет сгенерированный прогонщик
  schema:
    type: object
    required: [exit_code, timed_out, report]
    properties:
      exit_code: {type: integer}
      timed_out: {type: boolean}
      report: {$ref: Json}
      stderr_tail: {type: string}
Event:
  doc: событие от оболочки
  schema:
    type: object
    required: [kind]
    properties:
      kind: {type: string, enum: [model_answered, sandbox_finished, user_answered, command]}
      task: {$ref: Task}
      answer: {$ref: RawAnswer}
      target: {$ref: BuildTarget}
      output: {$ref: SandboxOutput}
      reply: {$ref: Json}
JournalEntry:
  doc: запись журнала; метку времени ставит оболочка
  schema:
    type: object
    required: [kind, subject]
    properties: {kind: {type: string}, subject: {type: string}, data: {$ref: Json}}
Transition:
  doc: итог события — новое состояние, доказательства, записи журнала
  schema:
    type: object
    required: [state, evidence, journal]
    properties:
      state: {$ref: State}
      evidence: {$ref: Evidences}
      journal: {type: array, items: {$ref: JournalEntry}}

# ── общение с моделями ──────────────────────────────────────────────────────
Prompt:
  doc: подсказка — устойчивый префикс роли, тело задачи, схема ответа
  schema:
    type: object
    required: [prefix, body, version, answer_schema, cache_key]
    properties:
      prefix: {type: string}
      body: {type: string}
      version: {type: string}
      answer_schema: {$ref: Json}
      cache_key: {$ref: Sha}
ProviderRequest:
  doc: запрос поставщику без ключей — ключи добавляет оболочка
  schema:
    type: object
    required: [provider, operator, mode, payload]
    properties:
      provider: {type: string}
      operator: {type: string}
      mode: {type: string, enum: [json_schema, tool, grammar, prompt]}
      endpoint: {type: string}
      payload: {$ref: Json}

# ── сборка ──────────────────────────────────────────────────────────────────
BuildTarget:
  doc: что собрать
  schema:
    type: object
    required: [kind, subject]
    properties:
      kind: {type: string, enum: [function_tests, node_package, program]}
      subject: {type: string}
FileSet:
  doc: файлы — путь → текст
  schema:
    type: object
    required: [files]
    properties: {files: {$ref: StrMap}}

# ── язык условий и типов (интерфейс rptg.lang) ──────────────────────────────
Cls:
  doc: список условий
  schema: {type: array, items: {$ref: Cl}}
TypeEnv:
  doc: окружение типов — схемы по именам и типы переменных
  schema:
    type: object
    required: [types, vars]
    properties:
      types: {type: object, additionalProperties: {$ref: Json}}
      vars: {$ref: StrMap}
EnvResult:
  doc: построенное окружение
  schema:
    type: object
    required: [ok, env, errors]
    properties: {ok: {type: boolean}, env: {$ref: TypeEnv}, errors: {$ref: Strings}}
ClInfo:
  doc: разбор, типизация и меры условия (LOGIC §4.5)
  schema:
    type: object
    required: [ok, errors, type, nodes, quant, nonlin, arith, strings, names]
    properties:
      ok: {type: boolean}
      errors: {$ref: Strings}
      type: {type: string}
      nodes: {type: integer, minimum: 0}
      quant: {type: integer, minimum: 0}
      nonlin: {type: integer, minimum: 0}
      arith: {type: boolean}
      strings: {type: boolean}
      names: {$ref: Strings}
EvalResult:
  doc: значение условия на данных; деление на ноль даёт ложь, а не ошибку
  schema:
    type: object
    required: [ok, value]
    properties: {ok: {type: boolean}, value: {type: boolean}, error: {type: string}}
Proof:
  doc: итог доказательства F ⇒ цель для списков длины до bound
  schema:
    type: object
    required: [verdict, bound]
    properties:
      verdict: {type: string, enum: [proved, refuted, unknown]}
      counterexample: {$ref: Json}
      bound: {type: integer, minimum: 1}
Sat:
  doc: выполнимость набора условий; core — номера строк противоречивого поднабора
  schema:
    type: object
    required: [verdict, core]
    properties:
      verdict: {type: string, enum: [sat, unsat, unknown]}
      core: {type: array, items: {type: integer, minimum: 0}}
SubResult:
  doc: тип a — подтип b; witness — значение, проходящее a и не проходящее b
  schema:
    type: object
    required: [ok]
    properties: {ok: {type: boolean}, witness: {$ref: Json}}
PathType:
  doc: тип значения по пути внутри типа
  schema:
    type: object
    required: [ok, schema]
    properties: {ok: {type: boolean}, name: {type: string}, schema: {$ref: Json}, error: {type: string}}
Validation:
  doc: итог проверки значения по типу
  schema:
    type: object
    required: [ok, errors]
    properties: {ok: {type: boolean}, errors: {$ref: Strings}}

# ── калибровка, контрольные случаи, представления ───────────────────────────
ReferenceItem:
  doc: эталонная задача калибровки — финальный узел с одной операцией и скрытыми тестами
  schema:
    type: object
    required: [id, class, card, hidden_tests]
    properties:
      id: {type: string}
      class: {$ref: WorkClass}
      card: {$ref: NodeCard}
      hidden_tests: {$ref: Json}
ReferenceSet:
  doc: эталонный набор
  schema:
    type: object
    required: [name, items]
    properties: {name: {type: string}, items: {type: array, items: {$ref: ReferenceItem}}}
CalibrationPlan:
  doc: раздел набора на подбор и проверку и задачи — каждый оператор на каждой задаче
  schema:
    type: object
    required: [fit, check, tasks]
    properties:
      fit: {$ref: Strings}
      check: {$ref: Strings}
      tasks: {type: array, items: {$ref: Task}}
CalibrationResult:
  doc: итог одной задачи калибровки
  schema:
    type: object
    required: [item, class, operator, passed, cost, finish_reason]
    properties:
      item: {type: string}
      class: {$ref: WorkClass}
      operator: {type: string}
      passed: {type: boolean}
      cost: {$ref: Decimal}
      finish_reason: {type: string}
CalibrationResults:
  doc: итоги калибровки
  schema: {type: array, items: {$ref: CalibrationResult}}
ControlCase:
  doc: контрольный случай проверки с известным вердиктом
  schema:
    type: object
    required: [id, check, input, expected]
    properties:
      id: {type: string}
      check: {$ref: Check}
      input: {$ref: Json}
      expected: {$ref: Verdict}
ControlCases:
  doc: набор контрольных случаев
  schema: {type: array, items: {$ref: ControlCase}}
CaseResult:
  doc: итог контрольного случая
  schema:
    type: object
    required: [id, check, expected, actual, ok]
    properties:
      id: {type: string}
      check: {$ref: Check}
      expected: {$ref: Verdict}
      actual: {$ref: Verdict}
      ok: {type: boolean}
CaseResults:
  doc: итоги контрольных случаев
  schema: {type: array, items: {$ref: CaseResult}}
SelftestReport:
  doc: сводка по проверкам — недоверенная проверка не даёт HARD-доказательств
  schema:
    type: object
    required: [checks]
    properties:
      checks:
        type: array
        items:
          type: object
          required: [check, passed, failed, trusted, failures]
          properties:
            check: {$ref: Check}
            passed: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            trusted: {type: boolean}
            failures: {$ref: Strings}
ViewQuery:
  doc: запрос представления
  schema:
    type: object
    required: [kind]
    properties:
      kind: {type: string, enum: [status, node, graph, competence]}
      subject: {type: string}
View:
  doc: представление для окна и командной строки
  schema:
    type: object
    required: [kind, data]
    properties: {kind: {type: string}, data: {$ref: Json}}
